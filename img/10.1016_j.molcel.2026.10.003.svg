<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#2B3138">Arginine methylation shortens 3'UTRs</text>
<!-- row 1 -->
<text x="24" y="68" font-size="15" font-weight="700" fill="#1E5FA8">PRMTs active: methylated PCF11 joins CPA</text>
<text x="250" y="102" text-anchor="middle" font-size="13" fill="#2B3138">weak proximal pA</text>
<text x="520" y="102" text-anchor="middle" font-size="13" fill="#2B3138">distal pA</text>
<rect x="40" y="110" width="110" height="24" rx="4" fill="#1E5FA8"/>
<text x="95" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">CDS</text>
<path d="M150 122 H250" stroke="#2B3138" stroke-width="4" stroke-linecap="round"/>
<path d="M250 122 H520" stroke="#8A949E" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round"/>
<path d="M243 108 H257 L250 119 Z" fill="#D98A00"/>
<path d="M513 108 H527 L520 119 Z" fill="#8A949E"/>
<path d="M242 114 L258 130 M258 114 L242 130" stroke="#C8323F" stroke-width="3" stroke-linecap="round"/>
<rect x="190" y="144" width="120" height="36" rx="10" fill="#1E5FA8" fill-opacity="0.1" stroke="#1E5FA8" stroke-width="2"/>
<text x="250" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#1E5FA8">PCF11 + CPA</text>
<circle cx="190" cy="162" r="11" fill="#C8323F"/>
<circle cx="310" cy="162" r="11" fill="#C8323F"/>
<text x="190" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Me</text>
<text x="310" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Me</text>
<text x="334" y="168" font-size="14" font-weight="700" fill="#C8323F">short isoform (oncogenic)</text>
<!-- divider -->
<path d="M24 205 H616" stroke="#8A949E" stroke-width="1.5" stroke-dasharray="3 5"/>
<!-- row 2 -->
<text x="24" y="236" font-size="15" font-weight="700" fill="#3C9A2E">PRMTs inhibited (DMAi): shift reverses</text>
<text x="250" y="270" text-anchor="middle" font-size="13" fill="#2B3138">weak proximal pA</text>
<text x="520" y="270" text-anchor="middle" font-size="13" fill="#2B3138">distal pA</text>
<rect x="40" y="278" width="110" height="24" rx="4" fill="#1E5FA8"/>
<text x="95" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">CDS</text>
<path d="M150 290 H520" stroke="#2B3138" stroke-width="4" stroke-linecap="round"/>
<path d="M243 276 H257 L250 287 Z" fill="#D98A00"/>
<path d="M513 276 H527 L520 287 Z" fill="#8A949E"/>
<path d="M512 282 L528 298 M528 282 L512 298" stroke="#C8323F" stroke-width="3" stroke-linecap="round"/>
<text x="250" y="312" text-anchor="middle" font-size="13" fill="#8A949E">site skipped</text>
<rect x="470" y="310" width="100" height="36" rx="10" fill="#8A949E" fill-opacity="0.1" stroke="#8A949E" stroke-width="2" stroke-dasharray="5 4"/>
<text x="520" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#2B3138">PCF11 + CPA</text>
<text x="340" y="338" text-anchor="end" font-size="14" font-weight="700" fill="#3C9A2E">long 3'UTR isoform</text>
<text x="320" y="384" text-anchor="middle" font-size="13" fill="#2B3138">Methylation helps PCF11 process weak proximal poly(A) sites</text>
</svg>
