<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="30" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">Rare variants and adult height</text>
  <text x="320" y="52" font-size="13" fill="#8A949E" text-anchor="middle">exome sequencing of more than 1.4 million people</text>
  <!-- funnel -->
  <rect x="30" y="86" width="230" height="64" rx="10" fill="#F3F5F7" stroke="#1E5FA8" stroke-width="2.5"/>
  <text x="145" y="110" font-size="13" font-weight="bold" fill="#1E5FA8" text-anchor="middle">Discovery</text>
  <text x="145" y="130" font-size="13" fill="#2B3138" text-anchor="middle">826,066 exomes</text>
  <path d="M145 154 L145 178" stroke="#2B3138" stroke-width="2.5"/><path d="M145 178 L139 169 M145 178 L151 169" stroke="#2B3138" stroke-width="2.5"/>
  <rect x="50" y="184" width="190" height="56" rx="10" fill="#F3F5F7" stroke="#D98A00" stroke-width="2.5"/>
  <text x="145" y="208" font-size="13" font-weight="bold" fill="#D98A00" text-anchor="middle">207 genes</text>
  <text x="145" y="227" font-size="13" fill="#2B3138" text-anchor="middle">rare protein-altering</text>
  <path d="M145 244 L145 268" stroke="#2B3138" stroke-width="2.5"/><path d="M145 268 L139 259 M145 268 L151 259" stroke="#2B3138" stroke-width="2.5"/>
  <rect x="30" y="274" width="230" height="64" rx="10" fill="#F3F5F7" stroke="#3C9A2E" stroke-width="2.5"/>
  <text x="145" y="298" font-size="13" font-weight="bold" fill="#3C9A2E" text-anchor="middle">Replication</text>
  <text x="145" y="318" font-size="13" fill="#2B3138" text-anchor="middle">624,567 more people</text>
  <text x="145" y="366" font-size="13" fill="#2B3138" text-anchor="middle">98% of genes replicate</text>
  <!-- height axis -->
  <path d="M300 80 L300 380" stroke="#8A949E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="470" y="84" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">Singleton loss-of-function</text>
  <text x="470" y="102" font-size="13" fill="#8A949E" text-anchor="middle">per-allele effect on height</text>
  <path d="M470 222 L470 126" stroke="#3C9A2E" stroke-width="3"/><path d="M470 126 L463 138 M470 126 L477 138" stroke="#3C9A2E" stroke-width="3"/>
  <path d="M470 222 L470 360" stroke="#C8323F" stroke-width="3"/><path d="M470 360 L463 348 M470 360 L477 348" stroke="#C8323F" stroke-width="3"/>
  <circle cx="470" cy="222" r="6" fill="#2B3138"/>
  <text x="486" y="226" font-size="13" fill="#2B3138">average height</text>
  <rect x="330" y="116" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#3C9A2E" stroke-width="2"/>
  <text x="390" y="138" font-size="13" fill="#3C9A2E" text-anchor="middle">FBN1: +11 cm</text>
  <rect x="330" y="316" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#C8323F" stroke-width="2"/>
  <text x="390" y="338" font-size="13" fill="#C8323F" text-anchor="middle">ACAN: −17 cm</text>
  <rect x="490" y="146" width="146" height="70" rx="8" fill="#F3F5F7" stroke="#D98A00" stroke-width="2"/>
  <text x="563" y="168" font-size="13" font-weight="bold" fill="#D98A00" text-anchor="middle">TET1, DTL, IGF2BP2</text>
  <text x="563" y="188" font-size="13" fill="#2B3138" text-anchor="middle">no known growth</text>
  <text x="563" y="205" font-size="13" fill="#2B3138" text-anchor="middle">syndrome</text>
</svg>
