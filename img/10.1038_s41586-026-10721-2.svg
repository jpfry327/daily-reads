<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B3138"/></marker></defs>
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#2B3138">Variants shape expression, cell type by cell type</text>
<!-- donors -->
<text x="80" y="76" text-anchor="middle" font-size="14" fill="#8A949E">Donors</text>
<g fill="#8A949E"><circle cx="40" cy="104" r="11"/><path d="M22 140 Q40 112 58 140 Z"/><circle cx="82" cy="104" r="11"/><path d="M64 140 Q82 112 100 140 Z"/><circle cx="124" cy="104" r="11"/><path d="M106 140 Q124 112 142 140 Z"/></g>
<rect x="15" y="160" width="130" height="40" rx="6" fill="#fff" stroke="#1E5FA8" stroke-width="3"/>
<text x="80" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#1E5FA8">Genome sequence</text>
<path d="M80 210 L80 246" stroke="#2B3138" stroke-width="3" marker-end="url(#a)"/>
<text x="80" y="268" text-anchor="middle" font-size="13" fill="#2B3138">Common variants</text>
<text x="80" y="286" text-anchor="middle" font-size="13" fill="#2B3138">Rare variants</text>
<!-- cells -->
<text x="300" y="76" text-anchor="middle" font-size="14" fill="#8A949E">Single immune cells</text>
<g stroke-width="3">
<circle cx="230" cy="120" r="24" fill="#D6E4F4" stroke="#1E5FA8"/><circle cx="230" cy="120" r="9" fill="#1E5FA8"/>
<circle cx="300" cy="120" r="24" fill="#DCEFD8" stroke="#3C9A2E"/><circle cx="300" cy="120" r="9" fill="#3C9A2E"/>
<circle cx="370" cy="120" r="24" fill="#FBE8C2" stroke="#D98A00"/><circle cx="370" cy="120" r="9" fill="#D98A00"/>
</g>
<text x="230" y="168" text-anchor="middle" font-size="13" fill="#1E5FA8">T cell</text>
<text x="300" y="168" text-anchor="middle" font-size="13" fill="#3C9A2E">B cell</text>
<text x="370" y="168" text-anchor="middle" font-size="13" fill="#D98A00">Monocyte</text>
<text x="300" y="196" text-anchor="middle" font-size="13" fill="#2B3138">Each cell modelled directly</text>
<path d="M150 180 L200 140" stroke="#2B3138" stroke-width="3" marker-end="url(#a)"/>
<!-- outcomes -->
<path d="M300 210 L300 244" stroke="#2B3138" stroke-width="3" marker-end="url(#a)"/>
<rect x="190" y="250" width="220" height="40" rx="6" fill="#fff" stroke="#2B3138" stroke-width="2"/>
<text x="300" y="275" text-anchor="middle" font-size="14" fill="#2B3138">Gene expression effects</text>
<path d="M240 292 L180 330" stroke="#2B3138" stroke-width="3" marker-end="url(#a)"/>
<path d="M360 292 L420 330" stroke="#2B3138" stroke-width="3" marker-end="url(#a)"/>
<rect x="90" y="334" width="190" height="42" rx="6" fill="#DCEFD8" stroke="#3C9A2E" stroke-width="2"/>
<text x="185" y="360" text-anchor="middle" font-size="14" fill="#2B3138">Cell-type specific</text>
<rect x="340" y="334" width="190" height="42" rx="6" fill="#FBE8C2" stroke="#D98A00" stroke-width="2"/>
<text x="435" y="360" text-anchor="middle" font-size="14" fill="#2B3138">Cell-state dependent</text>
<!-- right side: lens -->
<g transform="translate(540,150)">
<rect x="-70" y="-60" width="130" height="150" rx="8" fill="#fff" stroke="#8A949E" stroke-width="2" stroke-dasharray="6 5"/>
<text x="-5" y="-36" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3138">Variant types</text>
<circle cx="-40" cy="-4" r="9" fill="#1E5FA8"/><text x="-24" y="1" font-size="13" fill="#2B3138">Common</text>
<g fill="#C8323F"><circle cx="-42" cy="30" r="4"/><circle cx="-34" cy="38" r="4"/><circle cx="-44" cy="44" r="4"/></g><text x="-24" y="40" font-size="13" fill="#2B3138">Rare</text>
<text x="-5" y="68" text-anchor="middle" font-size="13" fill="#8A949E">summed per gene</text>
</g>
<path d="M410 120 L465 120" stroke="#2B3138" stroke-width="3" marker-end="url(#a)"/>
</svg>
