<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#2B3138">Who an age-50 rule leaves untested</text>
<!-- cohort -->
<rect x="20" y="60" width="600" height="58" rx="10" fill="#1E5FA8" fill-opacity="0.1" stroke="#1E5FA8" stroke-width="2"/>
<text x="320" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#2B3138">39,184 unselected patients, 32 solid tumour types</text>
<text x="320" y="104" text-anchor="middle" font-size="13" fill="#2B3138">germline sequencing of more than 90 predisposition genes</text>
<!-- onset bands -->
<rect x="20" y="150" width="190" height="130" rx="8" fill="#1E5FA8" fill-opacity="0.12"/>
<rect x="210" y="150" width="200" height="130" fill="#8A949E" fill-opacity="0.14"/>
<rect x="410" y="150" width="210" height="130" rx="8" fill="#D98A00" fill-opacity="0.12"/>
<text x="115" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#1E5FA8">Early onset</text>
<text x="310" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3138">Average onset</text>
<text x="515" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#D98A00">Late onset</text>
<!-- age axis -->
<path d="M20 296 L612 296" stroke="#2B3138" stroke-width="2.5" fill="none"/><path d="M608 289 L620 296 L608 303 Z" fill="#2B3138"/>
<text x="20" y="318" font-size="13" fill="#2B3138">younger at diagnosis</text>
<text x="620" y="318" text-anchor="end" font-size="13" fill="#2B3138">older at diagnosis</text>
<!-- carriers (schematic) -->
<g fill="#C8323F">
<circle cx="50" cy="206" r="8"/><circle cx="92" cy="232" r="8"/><circle cx="138" cy="200" r="8"/><circle cx="176" cy="244" r="8"/>
<circle cx="256" cy="214" r="8"/><circle cx="284" cy="250" r="8"/><circle cx="334" cy="208" r="8"/><circle cx="382" cy="236" r="8"/>
<circle cx="436" cy="204" r="8"/><circle cx="484" cy="246" r="8"/><circle cx="534" cy="212" r="8"/><circle cx="582" cy="240" r="8"/><circle cx="458" cy="262" r="8"/><circle cx="318" cy="268" r="8"/>
</g>
<!-- age 50 line -->
<line x1="230" y1="140" x2="230" y2="290" stroke="#2B3138" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="120" y="122" width="220" height="24" rx="6" fill="#fff" stroke="#2B3138" stroke-width="1.5"/>
<text x="230" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#2B3138">Testing only before age 50</text>
<!-- legend and takeaway -->
<circle cx="30" cy="334" r="7" fill="#C8323F"/>
<text x="44" y="339" font-size="13" fill="#2B3138">pathogenic variant carrier (schematic)</text>
<text x="320" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#C8323F">Most carriers fall outside the age-50 rule</text>
<text x="320" y="386" text-anchor="middle" font-size="13" fill="#2B3138">Variants are more common in earlier onset, but not limited to it</text>
</svg>
