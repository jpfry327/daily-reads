<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#2B3138">Independent signals across ancestries</text>
<!-- three ancestry GWAS tracks -->
<g stroke-width="2" fill="none">
<rect x="20" y="58" width="270" height="72" rx="10" fill="#1E5FA8" fill-opacity="0.08" stroke="#1E5FA8"/>
<rect x="20" y="140" width="270" height="72" rx="10" fill="#3C9A2E" fill-opacity="0.08" stroke="#3C9A2E"/>
<rect x="20" y="222" width="270" height="72" rx="10" fill="#D98A00" fill-opacity="0.08" stroke="#D98A00"/>
</g>
<g font-size="14" font-weight="700">
<text x="32" y="80" fill="#1E5FA8">Ancestry A</text>
<text x="32" y="162" fill="#3C9A2E">Ancestry B</text>
<text x="32" y="244" fill="#D98A00">Ancestry C</text>
</g>
<!-- locus lines with SNPs -->
<g stroke="#8A949E" stroke-width="1.5"><line x1="32" y1="110" x2="278" y2="110"/><line x1="32" y1="192" x2="278" y2="192"/><line x1="32" y1="274" x2="278" y2="274"/></g>
<g fill="#1E5FA8"><circle cx="60" cy="110" r="5"/><circle cx="100" cy="110" r="5"/><circle cx="160" cy="110" r="5"/><circle cx="230" cy="110" r="5"/></g>
<g fill="#3C9A2E"><circle cx="60" cy="192" r="5"/><circle cx="130" cy="192" r="5"/><circle cx="160" cy="192" r="5"/><circle cx="250" cy="192" r="5"/></g>
<g fill="#D98A00"><circle cx="75" cy="274" r="5"/><circle cx="160" cy="274" r="5"/><circle cx="200" cy="274" r="5"/><circle cx="262" cy="274" r="5"/></g>
<text x="160" y="316" text-anchor="middle" font-size="13" fill="#2B3138">GWAS summary statistics</text>
<!-- arrows to method -->
<g fill="none" stroke="#2B3138" stroke-width="2.5"><path d="M294 94 L330 170"/><path d="M294 176 L330 176"/><path d="M294 258 L330 190"/></g>
<path d="M322 164 L334 174 L320 180 z" fill="#2B3138"/>
<rect x="336" y="140" width="130" height="72" rx="14" fill="#1E5FA8"/>
<text x="401" y="172" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Manc-COJO</text>
<text x="401" y="193" text-anchor="middle" font-size="13" fill="#fff">conditional analysis</text>
<!-- LD reference -->
<rect x="336" y="58" width="130" height="62" rx="10" fill="#8A949E" fill-opacity="0.1" stroke="#8A949E" stroke-width="2"/>
<text x="401" y="84" text-anchor="middle" font-size="13" fill="#2B3138">LD reference:</text>
<text x="401" y="104" text-anchor="middle" font-size="13" fill="#2B3138">genotypes or matrix</text>
<path d="M401 122 V136" stroke="#2B3138" stroke-width="2.5"/>
<path d="M394 130 L401 140 L408 130" fill="none" stroke="#2B3138" stroke-width="2.5"/>
<!-- outputs -->
<path d="M468 160 L496 130" stroke="#2B3138" stroke-width="2.5"/>
<path d="M468 192 L496 224" stroke="#2B3138" stroke-width="2.5"/>
<rect x="498" y="70" width="128" height="106" rx="12" fill="#3C9A2E" fill-opacity="0.08" stroke="#3C9A2E" stroke-width="2"/>
<text x="562" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#3C9A2E">Independent</text>
<text x="562" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#3C9A2E">associations</text>
<line x1="512" y1="128" x2="612" y2="128" stroke="#8A949E" stroke-width="1.5"/>
<circle cx="530" cy="128" r="6" fill="#3C9A2E"/><circle cx="562" cy="128" r="6" fill="#3C9A2E"/><circle cx="596" cy="128" r="6" fill="#3C9A2E"/>
<text x="562" y="150" text-anchor="middle" font-size="13" fill="#2B3138">fewer false</text><text x="562" y="166" text-anchor="middle" font-size="13" fill="#2B3138">positives</text>
<rect x="498" y="200" width="128" height="106" rx="12" fill="#C8323F" fill-opacity="0.08" stroke="#C8323F" stroke-width="2"/>
<text x="562" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#C8323F">Manc-COJO:FIX</text>
<text x="562" y="246" text-anchor="middle" font-size="13" fill="#2B3138">ancestry-specific</text>
<text x="562" y="264" text-anchor="middle" font-size="13" fill="#2B3138">associations</text>
<circle cx="562" cy="286" r="6" fill="#D98A00"/>
<!-- footer -->
<rect x="20" y="340" width="606" height="40" rx="10" fill="#8A949E" fill-opacity="0.1"/>
<text x="323" y="366" text-anchor="middle" font-size="14" fill="#2B3138">C++ implementation, much faster than GCTA-COJO</text>
</svg>
