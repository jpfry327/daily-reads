<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#2B3138">A variant shifts 3′ UTR length</text>
<!-- gene model -->
<rect x="40" y="84" width="150" height="26" rx="4" fill="#1E5FA8"/><text x="115" y="102" text-anchor="middle" font-size="14" fill="#fff">coding</text>
<rect x="190" y="90" width="330" height="14" rx="3" fill="#8A949E" fill-opacity="0.5"/>
<text x="355" y="130" text-anchor="middle" font-size="14" fill="#8A949E">3′ UTR</text>
<g font-size="13" fill="#2B3138" text-anchor="middle"><line x1="290" y1="78" x2="290" y2="116" stroke="#D98A00" stroke-width="3"/><text x="290" y="72">proximal pA</text><line x1="520" y1="78" x2="520" y2="116" stroke="#D98A00" stroke-width="3"/><text x="520" y="72">distal pA</text></g>
<circle cx="250" cy="97" r="9" fill="#C8323F"/><text x="250" y="148" text-anchor="middle" font-size="13" fill="#C8323F">3′aQTL</text>
<!-- allele rows -->
<text x="40" y="196" font-size="15" fill="#2B3138" font-weight="700">allele A</text>
<rect x="120" y="182" width="70" height="20" rx="3" fill="#1E5FA8"/><rect x="190" y="186" width="100" height="12" rx="2" fill="#8A949E" fill-opacity="0.6"/>
<text x="300" y="197" font-size="13" fill="#2B3138">short</text>
<text x="40" y="240" font-size="15" fill="#2B3138" font-weight="700">allele G</text>
<rect x="120" y="226" width="70" height="20" rx="3" fill="#1E5FA8"/><rect x="190" y="230" width="330" height="12" rx="2" fill="#8A949E" fill-opacity="0.6"/>
<text x="530" y="241" font-size="13" fill="#2B3138">long</text>
<!-- cell types panel -->
<text x="40" y="300" font-size="15" fill="#2B3138">Mapped in each cell type</text>
<g font-size="13" fill="#2B3138" text-anchor="middle">
<circle cx="80" cy="346" r="22" fill="#3C9A2E" fill-opacity="0.85"/><text x="80" y="388">neurons</text>
<circle cx="190" cy="346" r="22" fill="#D98A00" fill-opacity="0.85"/><text x="190" y="388">astrocytes</text>
<circle cx="300" cy="346" r="22" fill="#1E5FA8" fill-opacity="0.85"/><text x="300" y="388">microglia</text>
</g>
<circle cx="450" cy="335" r="42" fill="#8A949E" fill-opacity="0.25" stroke="#8A949E" stroke-width="2"/>
<circle cx="520" cy="335" r="42" fill="#C8323F" fill-opacity="0.2" stroke="#C8323F" stroke-width="2"/>
<text x="438" y="340" text-anchor="middle" font-size="14" fill="#2B3138">eQTL</text>
<text x="528" y="340" text-anchor="middle" font-size="14" fill="#C8323F">3′aQTL</text>
<text x="485" y="285" text-anchor="middle" font-size="13" fill="#2B3138">GWAS loci: little overlap</text>
</svg>
