<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#2B3138">CCI-seq reads who touches whom</text>
<!-- step 1: clumps -->
<text x="95" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3138">1 Cell clumps</text>
<g stroke="#2B3138" stroke-width="1.5">
<circle cx="70" cy="110" r="20" fill="#1E5FA8" fill-opacity="0.8"/><circle cx="108" cy="104" r="20" fill="#D98A00" fill-opacity="0.85"/><circle cx="90" cy="142" r="20" fill="#3C9A2E" fill-opacity="0.8"/>
<circle cx="60" cy="210" r="20" fill="#C8323F" fill-opacity="0.8"/><circle cx="98" cy="218" r="20" fill="#1E5FA8" fill-opacity="0.8"/>
</g>
<text x="95" y="262" text-anchor="middle" font-size="13" fill="#2B3138">touching cells stay</text>
<text x="95" y="279" text-anchor="middle" font-size="13" fill="#2B3138">together</text>
<path d="M140 170 L172 170" stroke="#2B3138" stroke-width="3" fill="none"/><path d="M172 162 L184 170 L172 178 Z" fill="#2B3138"/>
<!-- step 2: combinatorial index -->
<text x="260" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3138">2 Clump barcodes</text>
<g fill="#8A949E" fill-opacity="0.15" stroke="#8A949E" stroke-width="2">
<rect x="196" y="96" width="30" height="30" rx="4"/><rect x="232" y="96" width="30" height="30" rx="4"/><rect x="268" y="96" width="30" height="30" rx="4"/>
<rect x="196" y="132" width="30" height="30" rx="4"/><rect x="232" y="132" width="30" height="30" rx="4"/><rect x="268" y="132" width="30" height="30" rx="4"/>
</g>
<rect x="232" y="132" width="30" height="30" rx="4" fill="#1E5FA8" fill-opacity="0.3" stroke="#1E5FA8" stroke-width="2.5"/>
<text x="260" y="196" text-anchor="middle" font-size="13" fill="#2B3138">combinatorial</text>
<text x="260" y="213" text-anchor="middle" font-size="13" fill="#2B3138">indexing</text>
<path d="M310 170 L342 170" stroke="#2B3138" stroke-width="3" fill="none"/><path d="M342 162 L354 170 L342 178 Z" fill="#2B3138"/>
<!-- step 3: scRNA-seq -->
<text x="420" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3138">3 Single-cell RNA-seq</text>
<rect x="364" y="96" width="112" height="76" rx="8" fill="#1E5FA8" fill-opacity="0.1" stroke="#1E5FA8" stroke-width="2"/>
<path d="M378 118 H462 M378 134 H452 M378 150 H462" stroke="#1E5FA8" stroke-width="3"/>
<text x="420" y="196" text-anchor="middle" font-size="13" fill="#2B3138">transcriptome per cell</text>
<text x="420" y="213" text-anchor="middle" font-size="13" fill="#2B3138">plus clump identity</text>
<path d="M480 134 L512 134" stroke="#2B3138" stroke-width="3" fill="none"/><path d="M512 126 L524 134 L512 142 Z" fill="#2B3138"/>
<!-- network -->
<text x="580" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3138">4 Network</text>
<g stroke="#8A949E" stroke-width="2.5"><path d="M550 110 L600 100 M600 100 L612 150 M550 110 L560 160 M560 160 L612 150 M600 100 L560 160"/></g>
<g stroke="#2B3138" stroke-width="1.5"><circle cx="550" cy="110" r="12" fill="#1E5FA8"/><circle cx="600" cy="100" r="12" fill="#D98A00"/><circle cx="612" cy="150" r="12" fill="#3C9A2E"/><circle cx="560" cy="160" r="12" fill="#C8323F"/></g>
<!-- findings -->
<rect x="24" y="312" width="190" height="60" rx="8" fill="#3C9A2E" fill-opacity="0.1" stroke="#3C9A2E" stroke-width="2"/>
<text x="119" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#3C9A2E">Mouse kidney</text>
<text x="119" y="353" text-anchor="middle" font-size="13" fill="#2B3138">ion transport programme</text>
<rect x="225" y="312" width="190" height="60" rx="8" fill="#D98A00" fill-opacity="0.1" stroke="#D98A00" stroke-width="2"/>
<text x="320" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#D98A00">Apc-KO intestine</text>
<text x="320" y="353" text-anchor="middle" font-size="13" fill="#2B3138">antigen presentation</text>
<rect x="426" y="312" width="190" height="60" rx="8" fill="#C8323F" fill-opacity="0.1" stroke="#C8323F" stroke-width="2"/>
<text x="521" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#C8323F">Colorectal cancer</text>
<text x="521" y="353" text-anchor="middle" font-size="13" fill="#2B3138">NF-κB inflammation</text>
<text x="320" y="296" text-anchor="middle" font-size="13" fill="#8A949E">interacting cells share distinct programmes</text>
</svg>
