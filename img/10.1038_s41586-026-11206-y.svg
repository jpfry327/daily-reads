<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B3138"/></marker></defs>
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#2B3138">Alzheimer's risk loci point to two cell types</text>
<!-- cohorts -->
<text x="95" y="76" text-anchor="middle" font-size="14" fill="#8A949E">Pooled cohorts</text>
<rect x="30" y="90" width="130" height="30" rx="4" fill="#C8323F" opacity=".85"/><text x="95" y="110" text-anchor="middle" font-size="13" fill="#fff">Cases</text>
<rect x="30" y="128" width="130" height="30" rx="4" fill="#D98A00" opacity=".85"/><text x="95" y="148" text-anchor="middle" font-size="13" fill="#fff">Proxy cases</text>
<rect x="30" y="166" width="130" height="30" rx="4" fill="#8A949E"/><text x="95" y="186" text-anchor="middle" font-size="13" fill="#fff">Controls</text>
<text x="95" y="222" text-anchor="middle" font-size="13" fill="#2B3138">Multiple ancestries</text>
<path d="M95 232 L95 262" stroke="#2B3138" stroke-width="3" marker-end="url(#a)"/>
<rect x="30" y="268" width="130" height="44" rx="6" fill="#fff" stroke="#1E5FA8" stroke-width="3"/>
<text x="95" y="287" text-anchor="middle" font-size="14" font-weight="700" fill="#1E5FA8">GWAS</text><text x="95" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#1E5FA8">meta-analysis</text>
<!-- chromosome with loci -->
<path d="M150 270 L225 246" stroke="#2B3138" stroke-width="3" marker-end="url(#a)"/>
<rect x="215" y="120" width="60" height="26" rx="13" fill="#E9EDF1" stroke="#8A949E" stroke-width="2"/>
<rect x="215" y="152" width="60" height="26" rx="13" fill="#E9EDF1" stroke="#8A949E" stroke-width="2"/>
<g fill="#C8323F"><rect x="228" y="120" width="5" height="26"/><rect x="254" y="152" width="5" height="26"/></g>
<text x="245" y="104" text-anchor="middle" font-size="14" fill="#2B3138">New + known loci</text>
<rect x="180" y="196" width="130" height="44" rx="6" fill="#fff" stroke="#2B3138" stroke-width="2"/>
<text x="245" y="215" text-anchor="middle" font-size="13" fill="#2B3138">Prioritised genes</text><text x="245" y="231" text-anchor="middle" font-size="13" fill="#2B3138">and drug targets</text>
<!-- split -->
<path d="M312 208 L372 150" stroke="#2B3138" stroke-width="3" marker-end="url(#a)"/>
<path d="M312 228 L372 290" stroke="#2B3138" stroke-width="3" marker-end="url(#a)"/>
<!-- microglia -->
<g transform="translate(450,140)">
<circle r="34" fill="#F6D9DC" stroke="#C8323F" stroke-width="3"/>
<circle cx="-6" cy="-4" r="11" fill="#C8323F"/>
<g stroke="#C8323F" stroke-width="4" stroke-linecap="round"><path d="M-30 -18 L-52 -34"/><path d="M30 -18 L52 -36"/><path d="M-26 24 L-46 44"/><path d="M28 26 L48 44"/><path d="M0 -34 L0 -56"/></g>
</g>
<text x="450" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#C8323F">Microglia</text>
<text x="450" y="230" text-anchor="middle" font-size="13" fill="#2B3138">Risk genes more active</text>
<!-- neuron -->
<g transform="translate(450,300)">
<circle r="26" fill="#D6E4F4" stroke="#1E5FA8" stroke-width="3"/>
<circle cx="0" cy="0" r="9" fill="#1E5FA8"/>
<g stroke="#1E5FA8" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M-24 -10 L-50 -26 M-50 -26 L-62 -22 M-50 -26 L-54 -40"/><path d="M24 -10 L50 -26 L64 -24"/><path d="M-20 18 L-44 36"/><path d="M26 22 L56 44"/></g>
</g>
<text x="450" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#1E5FA8">Neurons</text>
<text x="450" y="380" text-anchor="middle" font-size="13" fill="#2B3138">Risk genes less active</text>
</svg>
