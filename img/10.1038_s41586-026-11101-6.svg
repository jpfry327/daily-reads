<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B3138"/></marker></defs>
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#2B3138">Helicases end the spliceosome</text>
<!-- card 1 -->
<rect x="14" y="54" width="196" height="248" rx="12" fill="#1E5FA8" fill-opacity="0.06" stroke="#1E5FA8" stroke-width="2"/>
<text x="112" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#1E5FA8">1 Unwind</text>
<ellipse cx="96" cy="172" rx="62" ry="40" fill="#8A949E" fill-opacity="0.25" stroke="#8A949E" stroke-width="2"/>
<text x="90" y="168" text-anchor="middle" font-size="13" fill="#2B3138">U6 / U2</text>
<text x="90" y="185" text-anchor="middle" font-size="13" fill="#2B3138">snRNA</text>
<path d="M120 208 C112 236 150 246 160 226 C168 208 140 204 128 224" fill="none" stroke="#D98A00" stroke-width="5" stroke-linecap="round"/>
<text x="112" y="258" text-anchor="middle" font-size="13" fill="#D98A00" font-weight="700">intron lariat</text>
<rect x="24" y="96" width="76" height="24" rx="12" fill="#1E5FA8"/><text x="62" y="113" text-anchor="middle" font-size="13" fill="#fff">DHX15</text>
<rect x="108" y="96" width="92" height="24" rx="12" fill="#1E5FA8"/><text x="154" y="113" text-anchor="middle" font-size="13" fill="#fff">Aquarius</text>
<text x="112" y="286" text-anchor="middle" font-size="13" fill="#2B3138">branch point pulled out</text>
<!-- card 2 -->
<rect x="222" y="54" width="196" height="248" rx="12" fill="#3C9A2E" fill-opacity="0.06" stroke="#3C9A2E" stroke-width="2"/>
<text x="320" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#3C9A2E">2 Debranch</text>
<ellipse cx="304" cy="172" rx="62" ry="40" fill="#8A949E" fill-opacity="0.25" stroke="#8A949E" stroke-width="2"/>
<text x="298" y="177" text-anchor="middle" font-size="13" fill="#2B3138">U6 / 5'SS</text>
<path d="M338 204 C350 224 338 240 318 244 C300 248 286 244 272 234" fill="none" stroke="#D98A00" stroke-width="5" stroke-linecap="round"/>
<rect x="274" y="96" width="92" height="24" rx="12" fill="#3C9A2E"/><text x="320" y="113" text-anchor="middle" font-size="13" fill="#fff">DBR1</text>
<text x="320" y="262" text-anchor="middle" font-size="13" fill="#D98A00" font-weight="700">linear intron</text>
<text x="320" y="286" text-anchor="middle" font-size="13" fill="#2B3138">new debranched state</text>
<!-- card 3 -->
<rect x="430" y="54" width="196" height="248" rx="12" fill="#C8323F" fill-opacity="0.06" stroke="#C8323F" stroke-width="2"/>
<text x="528" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#C8323F">3 Eject</text>
<path d="M470 156 Q500 130 540 148" fill="none" stroke="#8A949E" stroke-width="3" stroke-dasharray="6 5"/>
<ellipse cx="490" cy="176" rx="36" ry="26" fill="#8A949E" fill-opacity="0.25" stroke="#8A949E" stroke-width="2" stroke-dasharray="6 5"/>
<ellipse cx="560" cy="188" rx="30" ry="22" fill="#8A949E" fill-opacity="0.25" stroke="#8A949E" stroke-width="2" stroke-dasharray="6 5"/>
<text x="520" y="222" text-anchor="middle" font-size="13" fill="#2B3138">disassembly</text>
<path d="M540 150 L590 122" stroke="#D98A00" stroke-width="5" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="440" y="94" width="76" height="24" rx="12" fill="#C8323F"/><text x="478" y="111" text-anchor="middle" font-size="13" fill="#fff">DHX35</text>
<text x="528" y="246" text-anchor="middle" font-size="13" fill="#2B3138">+ GPATCH1-WDR83</text>
<text x="528" y="264" text-anchor="middle" font-size="13" fill="#2B3138">assisted by YJU2B</text>
<text x="528" y="286" text-anchor="middle" font-size="13" fill="#D98A00" font-weight="700">intron released</text>
<!-- flow arrows -->
<path d="M212 178 L220 178" stroke="#2B3138" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M420 178 L428 178" stroke="#2B3138" stroke-width="2.5" marker-end="url(#ar)"/>
<!-- QC strip -->
<rect x="14" y="320" width="612" height="62" rx="12" fill="#D98A00" fill-opacity="0.1" stroke="#D98A00" stroke-width="2"/>
<text x="320" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#2B3138">Stalled on an aberrant intron</text>
<text x="320" y="368" text-anchor="middle" font-size="14" fill="#2B3138">YJU2B + LENG1 guide DHX35 to the same exit: quality control</text>
</svg>
