<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B3138"/></marker></defs>
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#2B3138">Interferon tone sets KRAS-drug response</text>
<text x="160" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#C8323F">Resistant KRAS-mutant organoid</text>
<text x="480" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#3C9A2E">Sensitive organoid</text>
<line x1="320" y1="50" x2="320" y2="370" stroke="#8A949E" stroke-dasharray="5 5"/>
<circle cx="160" cy="150" r="55" fill="#fff" stroke="#C8323F" stroke-width="3"/>
<text x="160" y="146" text-anchor="middle" font-size="14" fill="#2B3138">KRAS mutant</text>
<text x="160" y="166" text-anchor="middle" font-size="14" fill="#C8323F">MYC sustained</text>
<circle cx="480" cy="150" r="55" fill="#fff" stroke="#3C9A2E" stroke-width="3"/>
<text x="480" y="146" text-anchor="middle" font-size="14" fill="#2B3138">KRAS mutant</text>
<text x="480" y="166" text-anchor="middle" font-size="14" fill="#3C9A2E">IFN signalling</text>
<rect x="60" y="232" width="200" height="32" rx="5" fill="#fff" stroke="#C8323F" stroke-width="2"/>
<text x="160" y="253" text-anchor="middle" font-size="14" fill="#C8323F">Weak interferon signalling</text>
<rect x="380" y="232" width="200" height="32" rx="5" fill="#fff" stroke="#3C9A2E" stroke-width="2"/>
<text x="480" y="253" text-anchor="middle" font-size="14" fill="#3C9A2E">Active interferon signalling</text>
<line x1="160" y1="206" x2="160" y2="228" stroke="#2B3138" stroke-width="2" marker-end="url(#a)"/>
<line x1="480" y1="206" x2="480" y2="228" stroke="#2B3138" stroke-width="2" marker-end="url(#a)"/>
<text x="160" y="294" text-anchor="middle" font-size="13" fill="#2B3138">MRTX1133, HRS-4642, RMC-6236</text>
<text x="160" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#C8323F">Survives inhibitor</text>
<text x="480" y="294" text-anchor="middle" font-size="13" fill="#2B3138">Same KRAS inhibitors</text>
<text x="480" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#3C9A2E">Responds</text>
<text x="160" y="348" text-anchor="middle" font-size="14" fill="#2B3138">Add IFN-beta: synergy</text>
<text x="480" y="348" text-anchor="middle" font-size="14" fill="#2B3138">Block interferon: resistance</text>
