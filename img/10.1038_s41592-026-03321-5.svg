<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="30" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">MACH2: every optimal migration history</text>
  <text x="320" y="52" font-size="13" fill="#8A949E" text-anchor="middle">metastasis seeding reconstructed from tumour DNA sequencing</text>

  <text x="100" y="92" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">Clone tree</text>
  <text x="330" y="92" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">Many equal histories</text>
  <text x="552" y="92" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">Summary</text>

  <!-- clone tree -->
  <g stroke="#8A949E" stroke-width="2" fill="none">
    <line x1="100" y1="120" x2="60" y2="170"/><line x1="100" y1="120" x2="140" y2="170"/>
    <line x1="60" y1="170" x2="40" y2="225"/><line x1="60" y1="170" x2="80" y2="225"/>
    <line x1="140" y1="170" x2="140" y2="225"/>
  </g>
  <circle cx="100" cy="120" r="14" fill="#1E5FA8"/>
  <circle cx="60" cy="170" r="14" fill="#1E5FA8"/>
  <circle cx="140" cy="170" r="14" fill="#D98A00"/>
  <circle cx="40" cy="225" r="14" fill="#3C9A2E"/>
  <circle cx="80" cy="225" r="14" fill="#D98A00"/>
  <circle cx="140" cy="225" r="14" fill="#C8323F"/>
  <text x="100" y="262" font-size="13" fill="#2B3138" text-anchor="middle">clone colour =</text>
  <text x="100" y="280" font-size="13" fill="#2B3138" text-anchor="middle">observed site</text>

  <!-- arrow -->
  <path d="M168 190 L200 190" stroke="#2B3138" stroke-width="2" fill="none"/>
  <path d="M200 190 l-8 -5 v10 z" fill="#2B3138"/>

  <!-- history A -->
  <rect x="215" y="108" width="105" height="150" rx="6" fill="#F3F5F7" stroke="#8A949E"/>
  <text x="267" y="128" font-size="13" font-weight="bold" fill="#2B3138" text-anchor="middle">history A</text>
  <circle cx="267" cy="150" r="13" fill="#1E5FA8"/>
  <circle cx="237" cy="218" r="13" fill="#3C9A2E"/>
  <circle cx="267" cy="218" r="13" fill="#D98A00"/>
  <circle cx="297" cy="218" r="13" fill="#C8323F"/>
  <g stroke="#2B3138" stroke-width="2" fill="none">
    <path d="M259 161 L241 205"/><path d="M267 163 L267 205"/><path d="M276 160 L293 205"/>
  </g>
  <!-- history B -->
  <rect x="332" y="108" width="105" height="150" rx="6" fill="#F3F5F7" stroke="#8A949E"/>
  <text x="384" y="128" font-size="13" font-weight="bold" fill="#2B3138" text-anchor="middle">history B</text>
  <circle cx="384" cy="150" r="13" fill="#1E5FA8"/>
  <circle cx="354" cy="218" r="13" fill="#3C9A2E"/>
  <circle cx="384" cy="218" r="13" fill="#D98A00"/>
  <circle cx="414" cy="218" r="13" fill="#C8323F"/>
  <g stroke="#2B3138" stroke-width="2" fill="none">
    <path d="M376 161 L358 205"/><path d="M384 163 L384 205"/>
    <path d="M393 227 Q405 262 360 232" stroke-dasharray="4 3"/>
    <path d="M391 160 L410 205"/>
  </g>
  <text x="384" y="278" font-size="13" fill="#2B3138" text-anchor="middle">all tie on parsimony</text>
  <text x="267" y="278" font-size="13" fill="#2B3138" text-anchor="middle">+ fewest unseen</text>

  <!-- arrow -->
  <path d="M446 190 L478 190" stroke="#2B3138" stroke-width="2" fill="none"/>
  <path d="M478 190 l-8 -5 v10 z" fill="#2B3138"/>

  <!-- summary graph -->
  <rect x="490" y="108" width="125" height="150" rx="6" fill="#FFFFFF" stroke="#1E5FA8" stroke-width="2"/>
  <circle cx="552" cy="150" r="13" fill="#1E5FA8"/>
  <circle cx="515" cy="218" r="13" fill="#3C9A2E"/>
  <circle cx="552" cy="218" r="13" fill="#D98A00"/>
  <circle cx="589" cy="218" r="13" fill="#C8323F"/>
  <g stroke="#2B3138" stroke-width="3" fill="none">
    <path d="M544 161 L520 205"/><path d="M552 163 L552 205"/>
  </g>
  <path d="M560 160 L584 205" stroke="#8A949E" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <text x="552" y="278" font-size="13" fill="#2B3138" text-anchor="middle">solid = in every history</text>

  <!-- footer -->
  <line x1="40" y1="305" x2="600" y2="305" stroke="#E3E7EB"/>
  <rect x="40" y="320" width="14" height="14" fill="#2B3138"/>
  <text x="62" y="332" font-size="13" fill="#2B3138">high-confidence migration</text>
  <line x1="290" y1="327" x2="316" y2="327" stroke="#8A949E" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="324" y="332" font-size="13" fill="#2B3138">uncertain migration</text>
  <text x="320" y="368" font-size="13" fill="#2B3138" text-anchor="middle">MACH2-viz lets users explore the full solution space</text>
</svg>
