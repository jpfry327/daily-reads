<circle cx="420" cy="136" r="24" fill="none" stroke="#3C9A2E" stroke-dasharray="5 5"/>
<circle cx="495" cy="136" r="24" fill="none" stroke="#1E5FA8" stroke-dasharray="5 5"/>
<circle cx="570" cy="136" r="24" fill="#D98A00" fill-opacity="0.2" stroke="#D98A00"/>
<circle cx="420" cy="196" r="24" fill="#C8323F" fill-opacity="0.2" stroke="#C8323F"/>
<circle cx="495" cy="196" r="24" fill="#D98A00" fill-opacity="0.2" stroke="#D98A00"/>
<circle cx="570" cy="196" r="24" fill="#C8323F" fill-opacity="0.2" stroke="#C8323F"/>
<circle cx="458" cy="256" r="24" fill="#D98A00" fill-opacity="0.2" stroke="#D98A00"/>
<circle cx="533" cy="256" r="24" fill="#C8323F" fill-opacity="0.2" stroke="#C8323F"/>
</g>
<text x="420" y="141" text-anchor="middle" font-size="13" fill="#8A949E">IFN</text>
<text x="495" y="141" text-anchor="middle" font-size="13" fill="#8A949E">Prolif.</text>
<text x="570" y="141" text-anchor="middle" font-size="13" fill="#2B3138">TNFα</text>
<text x="420" y="201" text-anchor="middle" font-size="13" fill="#2B3138">EMT</text>
<text x="495" y="201" text-anchor="middle" font-size="13" fill="#2B3138">TNFα</text>
<text x="570" y="201" text-anchor="middle" font-size="13" fill="#2B3138">EMT</text>
<text x="458" y="261" text-anchor="middle" font-size="13" fill="#2B3138">TNFα</text>
<text x="533" y="261" text-anchor="middle" font-size="13" fill="#2B3138">EMT</text>
<text x="495" y="316" text-anchor="middle" font-size="13" fill="#2B3138">IFN, proliferative: depleted</text>
<text x="495" y="338" text-anchor="middle" font-size="13" fill="#2B3138">TNFα, EMT: persist or expand</text>
<text x="495" y="364" text-anchor="middle" font-size="13" fill="#8A949E">dashed = depleted state</text>
</svg>
