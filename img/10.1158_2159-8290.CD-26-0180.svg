<rect x="14" y="58" width="262" height="326" rx="12" fill="#8A949E" fill-opacity="0.08" stroke="#8A949E" stroke-width="2"/>
<text x="145" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#2B3138">Pre-treatment biopsy</text>
<g stroke-width="3">
<circle cx="70" cy="136" r="24" fill="#3C9A2E" fill-opacity="0.2" stroke="#3C9A2E"/>
<circle cx="145" cy="136" r="24" fill="#1E5FA8" fill-opacity="0.2" stroke="#1E5FA8"/>
<circle cx="220" cy="136" r="24" fill="#D98A00" fill-opacity="0.2" stroke="#D98A00"/>
<circle cx="107" cy="196" r="24" fill="#C8323F" fill-opacity="0.2" stroke="#C8323F"/>
<circle cx="182" cy="196" r="24" fill="#D98A00" fill-opacity="0.2" stroke="#D98A00"/>
</g>
<text x="70" y="141" text-anchor="middle" font-size="13" fill="#2B3138">IFN</text>
<text x="145" y="141" text-anchor="middle" font-size="13" fill="#2B3138">Prolif.</text>
<text x="220" y="141" text-anchor="middle" font-size="13" fill="#2B3138">TNFα</text>
<text x="107" y="201" text-anchor="middle" font-size="13" fill="#2B3138">EMT</text>
<text x="182" y="201" text-anchor="middle" font-size="13" fill="#2B3138">TNFα</text>
<!-- chromatin strip -->
<text x="145" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#2B3138">H3K4me1 at resistant programs</text>
<line x1="34" y1="290" x2="256" y2="290" stroke="#8A949E" stroke-width="3"/>
<g fill="#D98A00"><rect x="48" y="262" width="22" height="28" rx="4"/><rect x="104" y="262" width="22" height="28" rx="4"/></g>
<g fill="#C8323F"><rect x="170" y="262" width="22" height="28" rx="4"/><rect x="222" y="262" width="22" height="28" rx="4"/></g>
<text x="59" y="312" text-anchor="middle" font-size="13" fill="#D98A00">TNFα</text>
<text x="115" y="312" text-anchor="middle" font-size="13" fill="#D98A00">TNFα</text>
<text x="181" y="312" text-anchor="middle" font-size="13" fill="#C8323F">EMT</text>
<text x="233" y="312" text-anchor="middle" font-size="13" fill="#C8323F">EMT</text>
<text x="145" y="352" text-anchor="middle" font-size="13" fill="#2B3138">single-nucleus RNA + histone profiles</text>
<!-- arrow -->
<path d="M282 220 L352 220" stroke="#2B3138" stroke-width="3" marker-end="url(#ar)"/>
<text x="317" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3138">Chemo</text>
<!-- after -->
<rect x="364" y="58" width="262" height="326" rx="12" fill="#C8323F" fill-opacity="0.06" stroke="#C8323F" stroke-width="2"/>
<text x="495" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#C8323F">Post-chemo tumour</text>
