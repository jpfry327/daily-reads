<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#2B3138">Reading what a genomic model learned</text>
<!-- DNA sequence in -->
<text x="20" y="84" font-size="14" font-weight="700" fill="#2B3138">DNA sequence</text>
<g font-family="Courier New, monospace" font-size="20" font-weight="700" fill="#8A949E">
<text x="20" y="116" textLength="97" lengthAdjust="spacing">A C G T T</text>
<text x="20" y="146" textLength="140" lengthAdjust="spacing">G A <tspan fill="#D98A00">T G A C</tspan> T</text>
<text x="20" y="176" textLength="97" lengthAdjust="spacing">C T A G C</text>
</g>
<rect x="60" y="127" width="82" height="26" rx="5" fill="none" stroke="#D98A00" stroke-width="2"/>
<text x="20" y="206" font-size="13" fill="#8A949E">motif hidden in</text>
<text x="20" y="224" font-size="13" fill="#8A949E">regulatory DNA</text>
<path d="M178 150 L196 150" stroke="#2B3138" stroke-width="3" fill="none"/><path d="M194 142 L206 150 L194 158 Z" fill="#2B3138"/>
<!-- model black box -->
<rect x="210" y="84" width="150" height="132" rx="12" fill="#8A949E" fill-opacity="0.18" stroke="#8A949E" stroke-width="2.5"/>
<text x="285" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#2B3138">Deep learning</text>
<text x="285" y="144" text-anchor="middle" font-size="16" font-weight="700" fill="#2B3138">model</text>
<text x="285" y="176" text-anchor="middle" font-size="13" fill="#2B3138">predicts genomic</text>
<text x="285" y="194" text-anchor="middle" font-size="13" fill="#2B3138">signal</text>
<!-- tangermeme bar around -->
<rect x="196" y="232" width="178" height="52" rx="10" fill="#1E5FA8" fill-opacity="0.15" stroke="#1E5FA8" stroke-width="2.5"/>
<text x="285" y="256" text-anchor="middle" font-size="18" font-weight="700" fill="#1E5FA8">tangermeme</text>
<text x="285" y="274" text-anchor="middle" font-size="13" fill="#2B3138">everything-but-the-model</text>
<path d="M285 232 L285 222" stroke="#1E5FA8" stroke-width="3" fill="none"/><path d="M277 224 L285 214 L293 224 Z" fill="#1E5FA8"/>
<!-- arrow out -->
<path d="M370 150 L424 150" stroke="#2B3138" stroke-width="3" fill="none"/><path d="M422 142 L434 150 L422 158 Z" fill="#2B3138"/>
<!-- motif logo -->
<rect x="444" y="84" width="176" height="132" rx="12" fill="#3C9A2E" fill-opacity="0.1" stroke="#3C9A2E" stroke-width="2.5"/>
<g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
<text x="474" y="170" font-size="44" fill="#3C9A2E" transform="translate(0,0)">T</text>
<text x="514" y="170" font-size="60" fill="#1E5FA8">G</text>
<text x="554" y="170" font-size="52" fill="#D98A00">A</text>
<text x="594" y="170" font-size="36" fill="#C8323F">C</text>
</g>
<line x1="456" y1="178" x2="608" y2="178" stroke="#2B3138" stroke-width="2"/>
<text x="532" y="204" text-anchor="middle" font-size="13" fill="#2B3138">Learned motif, readable</text>
<text x="532" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#3C9A2E">Human-interpretable</text>
<text x="532" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#3C9A2E">cis-regulatory logic</text>
<text x="320" y="352" text-anchor="middle" font-size="14" fill="#2B3138">A toolkit for the steps after a model is trained</text>
<text x="320" y="374" text-anchor="middle" font-size="13" fill="#8A949E">Letter sizes are schematic</text>
</svg>
