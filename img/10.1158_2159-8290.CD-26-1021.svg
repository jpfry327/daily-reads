<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="30" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">Which patient fits which ADC?</text>
  <text x="320" y="52" font-size="13" fill="#8A949E" text-anchor="middle">87 tumour antigens profiled across solid tumours, then ranked by ReSort</text>

  <!-- left: tumour cell with antigen and ADC being internalized -->
  <text x="40" y="84" font-size="14" font-weight="bold" fill="#2B3138">What makes a target</text>
  <path d="M40 300 Q40 110 150 110 Q260 110 260 300 Z" fill="#FDF3E6" stroke="#D98A00" stroke-width="2"/>
  <text x="150" y="292" font-size="13" fill="#D98A00" text-anchor="middle">tumour cell</text>
  <!-- antigens on membrane -->
  <g stroke="#C8323F" stroke-width="3">
    <line x1="80" y1="150" x2="68" y2="138"/>
    <line x1="150" y1="110" x2="150" y2="94"/>
    <line x1="220" y1="150" x2="232" y2="138"/>
  </g>
  <!-- ADC: Y-shaped antibody with payload, bound to right antigen -->
  <g stroke="#1E5FA8" stroke-width="3" fill="none">
    <path d="M238 132 L248 120 M248 120 L246 104 M248 120 L262 112"/>
  </g>
  <circle cx="268" cy="108" r="5" fill="#2B3138"/>
  <text x="254" y="96" font-size="13" fill="#1E5FA8">ADC</text>
  <!-- internalization vesicle -->
  <circle cx="150" cy="168" r="18" fill="#FFFFFF" stroke="#1E5FA8" stroke-width="2"/>
  <path d="M150 162 L150 172 M150 172 L144 166" stroke="#1E5FA8" stroke-width="2" fill="none"/>
  <circle cx="157" cy="166" r="4" fill="#2B3138"/>
  <text x="150" y="210" font-size="13" fill="#2B3138" text-anchor="middle">internalised</text>
  <!-- payload sensitivity -->
  <circle cx="100" cy="242" r="4" fill="#2B3138"/><circle cx="116" cy="250" r="4" fill="#2B3138"/><circle cx="108" cy="232" r="4" fill="#2B3138"/>
  <text x="182" y="248" font-size="13" fill="#2B3138" text-anchor="middle">payload</text>
  <text x="182" y="264" font-size="13" fill="#2B3138" text-anchor="middle">sensitivity</text>

  <!-- data layers feeding in -->
  <g font-size="13" fill="#2B3138">
    <text x="40" y="330">expression</text>
    <text x="40" y="350">heterogeneity</text>
    <text x="150" y="330">immune context</text>
    <text x="150" y="350">RNA, protein, spatial</text>
  </g>

  <!-- arrow -->
  <line x1="276" y1="210" x2="310" y2="210" stroke="#2B3138" stroke-width="2"/>
  <polygon points="318,210 308,204 308,216" fill="#2B3138"/>

  <!-- right: ReSort two-tier sort -->
  <text x="470" y="84" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">ReSort: two tiers</text>
  <!-- tier 1 sieve -->
  <rect x="330" y="104" width="280" height="40" rx="8" fill="#EAF1FA" stroke="#1E5FA8" stroke-width="2"/>
  <text x="470" y="129" font-size="13" fill="#1E5FA8" text-anchor="middle">Tier 1: target present?</text>
  <!-- tier 2 sieve -->
  <rect x="350" y="170" width="240" height="40" rx="8" fill="#EEF7EC" stroke="#3C9A2E" stroke-width="2"/>
  <text x="470" y="195" font-size="13" fill="#3C9A2E" text-anchor="middle">Tier 2: likely to work?</text>
  <g stroke="#2B3138" stroke-width="2">
    <line x1="470" y1="146" x2="470" y2="164"/>
    <line x1="470" y1="212" x2="470" y2="232"/>
  </g>
  <polygon points="470,168 465,160 475,160" fill="#2B3138"/>
  <polygon points="470,236 465,228 475,228" fill="#2B3138"/>

  <!-- output: basket and umbrella -->
  <rect x="336" y="244" width="124" height="96" rx="8" fill="#FFFFFF" stroke="#8A949E" stroke-width="1.5"/>
  <text x="398" y="264" font-size="13" font-weight="bold" fill="#2B3138" text-anchor="middle">Basket</text>
  <text x="398" y="282" font-size="13" fill="#2B3138" text-anchor="middle">one ADC,</text>
  <text x="398" y="298" font-size="13" fill="#2B3138" text-anchor="middle">many tumours</text>
  <g fill="#D98A00"><circle cx="372" cy="320" r="6"/><circle cx="390" cy="320" r="6" fill="#C8323F"/><circle cx="408" cy="320" r="6" fill="#3C9A2E"/><circle cx="426" cy="320" r="6" fill="#1E5FA8"/></g>

  <rect x="480" y="244" width="124" height="96" rx="8" fill="#FFFFFF" stroke="#8A949E" stroke-width="1.5"/>
  <text x="542" y="264" font-size="13" font-weight="bold" fill="#2B3138" text-anchor="middle">Umbrella</text>
  <text x="542" y="282" font-size="13" fill="#2B3138" text-anchor="middle">one tumour,</text>
  <text x="542" y="298" font-size="13" fill="#2B3138" text-anchor="middle">best ADC</text>
  <g stroke="#1E5FA8" stroke-width="2.5" fill="none">
    <path d="M516 326 L516 316 M516 316 L510 309 M516 316 L522 309"/>
    <path d="M542 326 L542 316 M542 316 L536 309 M542 316 L548 309"/>
    <path d="M568 326 L568 316 M568 316 L562 309 M568 316 L574 309"/>
  </g>

  <text x="470" y="372" font-size="13" fill="#8A949E" text-anchor="middle">virtual trial matching, incl. rare cancers</text>
</svg>
