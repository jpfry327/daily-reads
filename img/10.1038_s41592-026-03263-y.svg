<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="30" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">SpillOT: removing channel bleed-through</text>
  <text x="320" y="52" font-size="13" fill="#8A949E" text-anchor="middle">learns from the input image alone, no extra wet-lab controls</text>

  <!-- column headers -->
  <text x="110" y="86" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">Raw channels</text>
  <text x="320" y="86" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">Optimal transport</text>
  <text x="530" y="86" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">Corrected</text>

  <!-- RAW: channel A (CD3) and channel B (CD8) with ghost from A -->
  <rect x="40" y="100" width="140" height="110" rx="6" fill="#F3F5F7" stroke="#1E5FA8" stroke-width="2"/>
  <text x="50" y="118" font-size="13" font-weight="bold" fill="#1E5FA8">channel A</text>
  <g fill="#1E5FA8">
    <circle cx="80" cy="150" r="11"/><circle cx="128" cy="140" r="11"/><circle cx="104" cy="186" r="11"/><circle cx="152" cy="180" r="11"/>
  </g>

  <rect x="40" y="226" width="140" height="110" rx="6" fill="#F3F5F7" stroke="#C8323F" stroke-width="2"/>
  <text x="50" y="244" font-size="13" font-weight="bold" fill="#C8323F">channel B</text>
  <!-- true B signal -->
  <g fill="#C8323F"><circle cx="70" cy="300" r="11"/><circle cx="150" cy="268" r="11"/></g>
  <!-- spillover ghosts copying A positions -->
  <g fill="none" stroke="#1E5FA8" stroke-width="2" stroke-dasharray="3 3">
    <circle cx="80" cy="276" r="11"/><circle cx="104" cy="312" r="11"/><circle cx="152" cy="306" r="11"/>
  </g>
  <!-- noise speckle -->
  <g fill="#8A949E"><circle cx="120" cy="290" r="2"/><circle cx="58" cy="258" r="2"/><circle cx="168" cy="326" r="2"/><circle cx="96" cy="262" r="2"/><circle cx="132" cy="320" r="2"/></g>
  <text x="110" y="356" font-size="13" fill="#2B3138" text-anchor="middle">spillover + noise</text>

  <!-- MIDDLE: patch matching across channels -->
  <rect x="236" y="116" width="58" height="58" fill="none" stroke="#1E5FA8" stroke-width="2"/>
  <rect x="346" y="116" width="58" height="58" fill="none" stroke="#C8323F" stroke-width="2"/>
  <text x="265" y="194" font-size="13" fill="#1E5FA8" text-anchor="middle">A patch</text>
  <text x="375" y="194" font-size="13" fill="#C8323F" text-anchor="middle">B patch</text>
  <circle cx="265" cy="145" r="12" fill="#1E5FA8"/>
  <circle cx="375" cy="145" r="12" fill="none" stroke="#1E5FA8" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- transport lines -->
  <g stroke="#D98A00" stroke-width="2">
    <line x1="296" y1="132" x2="344" y2="132"/>
    <line x1="296" y1="145" x2="344" y2="145"/>
    <line x1="296" y1="158" x2="344" y2="158"/>
  </g>
  <text x="320" y="226" font-size="13" fill="#D98A00" text-anchor="middle">match similar patches</text>
  <rect x="246" y="246" width="148" height="68" rx="8" fill="#FDF3E6" stroke="#D98A00" stroke-width="2"/>
  <text x="320" y="270" font-size="13" fill="#2B3138" text-anchor="middle">shared pattern =</text>
  <text x="320" y="288" font-size="13" fill="#2B3138" text-anchor="middle">bleed, remove it;</text>
  <text x="320" y="306" font-size="13" fill="#2B3138" text-anchor="middle">keep true signal</text>

  <!-- arrows -->
  <line x1="186" y1="220" x2="226" y2="220" stroke="#2B3138" stroke-width="2"/>
  <polygon points="234,220 224,214 224,226" fill="#2B3138"/>
  <line x1="410" y1="220" x2="450" y2="220" stroke="#2B3138" stroke-width="2"/>
  <polygon points="458,220 448,214 448,226" fill="#2B3138"/>

  <!-- CORRECTED -->
  <rect x="460" y="100" width="140" height="110" rx="6" fill="#F3F5F7" stroke="#1E5FA8" stroke-width="2"/>
  <text x="470" y="118" font-size="13" font-weight="bold" fill="#1E5FA8">channel A</text>
  <g fill="#1E5FA8"><circle cx="500" cy="150" r="11"/><circle cx="548" cy="140" r="11"/><circle cx="524" cy="186" r="11"/><circle cx="572" cy="180" r="11"/></g>

  <rect x="460" y="226" width="140" height="110" rx="6" fill="#F3F5F7" stroke="#C8323F" stroke-width="2"/>
  <text x="470" y="244" font-size="13" font-weight="bold" fill="#C8323F">channel B</text>
  <g fill="#C8323F"><circle cx="490" cy="300" r="11"/><circle cx="570" cy="268" r="11"/></g>
  <text x="530" y="356" font-size="13" fill="#3C9A2E" text-anchor="middle">true signal only</text>

  <text x="320" y="384" font-size="13" fill="#8A949E" text-anchor="middle">tested on IMC, CyCIF and Opal; released as script and Fiji plugin</text>
</svg>
