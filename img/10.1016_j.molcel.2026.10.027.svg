<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="30" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">RNA processing keeps HP1a on chromatin</text>
  <text x="320" y="52" font-size="13" fill="#8A949E" text-anchor="middle">hit found by an image-based CRISPR screen</text>

  <line x1="320" y1="72" x2="320" y2="372" stroke="#8A949E" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- LEFT: intact RNA processing -->
  <text x="160" y="94" font-size="15" font-weight="bold" fill="#1E5FA8" text-anchor="middle">RNA processing intact</text>
  <circle cx="160" cy="180" r="62" fill="#DCE6F2" stroke="#1E5FA8" stroke-width="2"/>
  <text x="160" y="186" font-size="14" font-weight="bold" fill="#1E5FA8" text-anchor="middle">HP1a</text>
  <text x="160" y="206" font-size="13" fill="#1E5FA8" text-anchor="middle">condensate</text>
  <line x1="60" y1="276" x2="260" y2="276" stroke="#2B3138" stroke-width="5"/>
  <text x="160" y="300" font-size="13" fill="#2B3138" text-anchor="middle">heterochromatin</text>
  <line x1="130" y1="242" x2="124" y2="268" stroke="#1E5FA8" stroke-width="2.5"/>
  <line x1="160" y1="242" x2="160" y2="268" stroke="#1E5FA8" stroke-width="2.5"/>
  <line x1="190" y1="242" x2="196" y2="268" stroke="#1E5FA8" stroke-width="2.5"/>
  <rect x="48" y="320" width="224" height="38" rx="8" fill="none" stroke="#3C9A2E" stroke-width="2"/>
  <text x="160" y="344" font-size="14" fill="#3C9A2E" text-anchor="middle">silencing maintained</text>

  <!-- RIGHT: processing disrupted -->
  <text x="480" y="94" font-size="15" font-weight="bold" fill="#C8323F" text-anchor="middle">RNA processing disrupted</text>
  <circle cx="480" cy="180" r="62" fill="#FFFFFF" stroke="#C8323F" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#1E5FA8">
    <circle cx="452" cy="160" r="7"/><circle cx="498" cy="152" r="7"/><circle cx="512" cy="196" r="7"/>
    <circle cx="462" cy="206" r="7"/><circle cx="486" cy="182" r="7"/>
  </g>
  <!-- RNA strands binding HP1a -->
  <path d="M432 146 q12 -9 24 0 t24 0" fill="none" stroke="#D98A00" stroke-width="2.5"/>
  <path d="M444 214 q12 -9 24 0 t24 0" fill="none" stroke="#D98A00" stroke-width="2.5"/>
  <text x="624" y="150" font-size="13" fill="#D98A00" text-anchor="end">more RNA</text>
  <text x="624" y="168" font-size="13" fill="#D98A00" text-anchor="end">bound</text>
  <line x1="380" y1="276" x2="580" y2="276" stroke="#2B3138" stroke-width="5"/>
  <text x="480" y="300" font-size="13" fill="#2B3138" text-anchor="middle">chromatin, HP1a lost</text>
  <path d="M450 250 l-10 14" stroke="#C8323F" stroke-width="2.5"/>
  <path d="M440 250 l10 14" stroke="#C8323F" stroke-width="2.5"/>
  <path d="M520 250 l-10 14" stroke="#C8323F" stroke-width="2.5"/>
  <path d="M510 250 l10 14" stroke="#C8323F" stroke-width="2.5"/>
  <rect x="368" y="320" width="224" height="38" rx="8" fill="none" stroke="#C8323F" stroke-width="2"/>
  <text x="480" y="344" font-size="14" fill="#C8323F" text-anchor="middle">silencing lost</text>
</svg>
