<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#2B3138">ALTER: human AGO2 edits C to U in RNA</text>
<!-- target mRNA -->
<path d="M40 250 H600" stroke="#2B3138" stroke-width="5" stroke-linecap="round"/>
<text x="40" y="282" font-size="13" fill="#2B3138">target mRNA</text>
<!-- guide RNA pairing -->
<path d="M210 190 Q250 170 290 190 H410 Q450 170 490 190" fill="none" stroke="#C8323F" stroke-width="5" stroke-linecap="round"/>
<g stroke="#C8323F" stroke-width="2"><line x1="300" y1="190" x2="300" y2="250"/><line x1="320" y1="190" x2="320" y2="250"/><line x1="340" y1="190" x2="340" y2="250"/><line x1="380" y1="190" x2="380" y2="250"/><line x1="400" y1="190" x2="400" y2="250"/></g>
<text x="530" y="178" font-size="13" font-weight="700" fill="#C8323F">guide RNA</text>
<!-- target C -->
<circle cx="360" cy="250" r="14" fill="#fff" stroke="#D98A00" stroke-width="4"/>
<text x="360" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#D98A00">C</text>
<!-- AGO2 body -->
<path d="M230 150 Q230 80 320 76 Q420 80 420 150 Q420 186 380 186 H270 Q230 186 230 150 z" fill="#1E5FA8"/>
<text x="325" y="124" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">AGO2</text>
<text x="325" y="150" text-anchor="middle" font-size="13" fill="#fff">human protein</text>
<!-- deaminase -->
<rect x="436" y="106" width="112" height="56" rx="28" fill="#D98A00"/>
<text x="492" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">deaminase</text>
<line x1="420" y1="134" x2="436" y2="134" stroke="#2B3138" stroke-width="3"/>
<!-- deaminase action arrow to C -->
<path d="M480 164 Q470 220 380 240" fill="none" stroke="#D98A00" stroke-width="3" stroke-dasharray="6 5"/>
<path d="M388 232 L374 242 L390 247" fill="none" stroke="#D98A00" stroke-width="3"/>
<!-- result U -->
<path d="M360 296 V312" stroke="#2B3138" stroke-width="2.5"/>
<path d="M353 306 L360 316 L367 306" fill="none" stroke="#2B3138" stroke-width="2.5"/>
<circle cx="360" cy="338" r="14" fill="#D98A00"/>
<text x="360" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">U</text>
<text x="394" y="344" font-size="13" fill="#2B3138">edited base</text>
<!-- comparison -->
<rect x="20" y="62" width="170" height="108" rx="12" fill="#8A949E" fill-opacity="0.1" stroke="#8A949E" stroke-width="2"/>
<text x="105" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3138">Cas13 editors</text>
<text x="105" y="108" text-anchor="middle" font-size="13" fill="#2B3138">CURE, RESCUE</text>
<text x="105" y="128" text-anchor="middle" font-size="13" fill="#2B3138">non-human scaffold</text>
<text x="105" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#C8323F">more immunogenic</text>
<!-- ML -->
<rect x="20" y="316" width="190" height="64" rx="12" fill="#3C9A2E" fill-opacity="0.1" stroke="#3C9A2E" stroke-width="2"/>
<text x="115" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#3C9A2E">ML deimmunization</text>
<text x="115" y="362" text-anchor="middle" font-size="13" fill="#2B3138">fewer immunogenic peptides</text>
</svg>
