<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#FFFFFF"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2B3138">RSparsePro: fine-mapping with LD mismatch</text>
<!-- genome track -->
<line x1="50" y1="150" x2="590" y2="150" stroke="#8A949E" stroke-width="2"/>
<g fill="#2B3138"><circle cx="90" cy="150" r="8"/><circle cx="170" cy="150" r="8"/><circle cx="250" cy="150" r="8"/><circle cx="330" cy="150" r="8" fill="#C8323F"/><circle cx="410" cy="150" r="8"/><circle cx="490" cy="150" r="8"/><circle cx="550" cy="150" r="8"/></g>
<text x="330" y="182" text-anchor="middle" font-size="14" fill="#C8323F">causal variant</text>
<!-- GWAS LD arcs above -->
<path d="M250 142 Q290 90 330 142" fill="none" stroke="#1E5FA8" stroke-width="3"/>
<path d="M330 142 Q370 90 410 142" fill="none" stroke="#1E5FA8" stroke-width="3"/>
<path d="M250 142 Q330 60 410 142" fill="none" stroke="#1E5FA8" stroke-width="3"/>
<text x="60" y="80" font-size="14" font-weight="bold" fill="#1E5FA8">GWAS cohort LD</text>
<!-- reference LD arcs below -->
<path d="M410 158 Q450 210 490 158" fill="none" stroke="#8A949E" stroke-width="3"/>
<path d="M490 158 Q520 205 550 158" fill="none" stroke="#8A949E" stroke-width="3"/>
<path d="M410 158 Q480 235 550 158" fill="none" stroke="#8A949E" stroke-width="3"/>
<text x="60" y="222" font-size="14" font-weight="bold" fill="#8A949E">Reference panel LD</text>
<text x="590" y="244" text-anchor="end" font-size="14" font-weight="bold" fill="#D98A00">LD mismatch</text>
<!-- credible sets -->
<text x="60" y="290" font-size="14" fill="#2B3138">Standard fine-mapping</text>
<rect x="250" y="270" width="310" height="28" rx="14" fill="none" stroke="#C8323F" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="405" y="289" text-anchor="middle" font-size="13" fill="#C8323F">credible set misses or widens</text>
<text x="60" y="350" font-size="14" font-weight="bold" fill="#3C9A2E">RSparsePro</text>
<rect x="302" y="330" width="56" height="28" rx="14" fill="none" stroke="#3C9A2E" stroke-width="3"/>
<text x="400" y="349" font-size="13" fill="#3C9A2E">credible set covers causal SNP</text>
</svg>
