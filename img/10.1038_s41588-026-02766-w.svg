<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#2B3138">Ranking rare missense variants</text>
<!-- pool of variants -->
<rect x="24" y="64" width="200" height="236" rx="10" fill="#8A949E" fill-opacity="0.1" stroke="#8A949E" stroke-width="2"/>
<g fill="#8A949E" fill-opacity="0.8">
<circle cx="50" cy="92" r="6"/><circle cx="84" cy="104" r="6"/><circle cx="120" cy="88" r="6"/><circle cx="160" cy="100" r="6"/><circle cx="196" cy="90" r="6"/>
<circle cx="44" cy="130" r="6"/><circle cx="76" cy="146" r="6"/><circle cx="110" cy="126" r="6"/><circle cx="148" cy="140" r="6"/><circle cx="184" cy="128" r="6"/><circle cx="208" cy="150" r="6"/>
<circle cx="56" cy="176" r="6"/><circle cx="92" cy="190" r="6"/><circle cx="126" cy="172" r="6"/><circle cx="164" cy="186" r="6"/><circle cx="198" cy="176" r="6"/>
<circle cx="46" cy="222" r="6"/><circle cx="82" cy="236" r="6"/><circle cx="118" cy="218" r="6"/><circle cx="154" cy="232" r="6"/><circle cx="190" cy="220" r="6"/>
<circle cx="64" cy="268" r="6"/><circle cx="104" cy="272" r="6"/><circle cx="142" cy="264" r="6"/><circle cx="180" cy="274" r="6"/>
</g>
<g fill="#D98A00"><circle cx="120" cy="150" r="7"/><circle cx="168" cy="212" r="7"/><circle cx="72" cy="206" r="7"/></g>
<text x="124" y="324" text-anchor="middle" font-size="14" fill="#2B3138">Rare missense variants</text>
<text x="124" y="344" text-anchor="middle" font-size="13" fill="#8A949E">functional or neutral?</text>
<!-- arrow to funnel -->
<path d="M228 180 L262 180" stroke="#2B3138" stroke-width="3" fill="none"/><path d="M262 172 L274 180 L262 188 Z" fill="#2B3138"/>
<!-- funnel -->
<path d="M268 84 L412 84 L378 250 L302 250 Z" fill="#1E5FA8" fill-opacity="0.15" stroke="#1E5FA8" stroke-width="2.5"/>
<text x="340" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#1E5FA8">RovHer</text>
<text x="340" y="160" text-anchor="middle" font-size="13" fill="#2B3138">75 variant and</text>
<text x="340" y="178" text-anchor="middle" font-size="13" fill="#2B3138">gene features</text>
<text x="340" y="282" text-anchor="middle" font-size="13" fill="#2B3138">Exome-wide association</text>
<text x="340" y="300" text-anchor="middle" font-size="13" fill="#2B3138">statistics, UK Biobank</text>
<!-- arrow out -->
<path d="M344 254 L344 262" stroke="#1E5FA8" stroke-width="3" fill="none"/>
<path d="M404 168 L440 168" stroke="#2B3138" stroke-width="3" fill="none"/><path d="M440 160 L452 168 L440 176 Z" fill="#2B3138"/>
<!-- selected -->
<rect x="458" y="64" width="162" height="100" rx="10" fill="#D98A00" fill-opacity="0.1" stroke="#D98A00" stroke-width="2"/>
<g fill="#D98A00"><circle cx="500" cy="88" r="7"/><circle cx="540" cy="82" r="7"/><circle cx="580" cy="92" r="7"/><circle cx="520" cy="112" r="7"/><circle cx="562" cy="116" r="7"/></g>
<text x="539" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#D98A00">Top 1% prioritised</text>
<rect x="458" y="182" width="162" height="52" rx="8" fill="#3C9A2E" fill-opacity="0.12" stroke="#3C9A2E" stroke-width="2"/>
<text x="539" y="205" text-anchor="middle" font-size="13" fill="#2B3138">Explains more rare-</text>
<text x="539" y="222" text-anchor="middle" font-size="13" fill="#2B3138">variant heritability</text>
<rect x="458" y="248" width="162" height="52" rx="8" fill="#C8323F" fill-opacity="0.1" stroke="#C8323F" stroke-width="2"/>
<text x="539" y="271" text-anchor="middle" font-size="13" fill="#2B3138">Flags high-risk carriers</text>
<text x="539" y="288" text-anchor="middle" font-size="13" fill="#2B3138">of severe outcomes</text>
<text x="320" y="382" text-anchor="middle" font-size="13" fill="#8A949E">Scores are independent of allele frequency</text>
</svg>
