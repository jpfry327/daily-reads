<!-- arrows to embedding -->
<g stroke="#8A949E" stroke-width="2.5" fill="#8A949E"><path d="M320 112 L384 150"/><polygon points="378,160 394,156 386,142"/><path d="M320 212 L384 212"/><polygon points="384,205 396,212 384,219"/><path d="M320 312 L384 274"/><polygon points="378,264 394,268 386,282"/></g>
