<polygon points="548,132 562,122 562,140" fill="#2B3138" transform="rotate(10 556 132)"/>
<text x="506" y="204" font-size="13" fill="#2B3138">disease</text>
<text x="506" y="220" font-size="13" fill="#2B3138">trajectory</text>
<circle cx="468" cy="268" r="9" fill="#D98A00"/><text x="468" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
<circle cx="520" cy="176" r="9" fill="#3C9A2E"/><text x="520" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
