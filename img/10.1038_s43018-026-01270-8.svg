<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="32" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">Hist2Prot: proteins predicted from H&amp;E</text>

  <!-- H&E section: every cell looks alike -->
  <rect x="30" y="58" width="190" height="190" rx="10" fill="#FBEEF0" stroke="#8A949E" stroke-width="1.5"/>
  <g fill="#C8323F" fill-opacity="0.22" stroke="#C8323F" stroke-opacity="0.55" stroke-width="1.5">
    <circle cx="70" cy="98" r="17"/><circle cx="115" cy="93" r="17"/><circle cx="165" cy="103" r="17"/>
    <circle cx="190" cy="143" r="17"/><circle cx="145" cy="143" r="17"/><circle cx="100" cy="138" r="17"/>
    <circle cx="60" cy="153" r="17"/><circle cx="80" cy="198" r="17"/><circle cx="125" cy="188" r="17"/>
    <circle cx="170" cy="193" r="17"/><circle cx="195" cy="223" r="17"/><circle cx="130" cy="226" r="17"/>
  </g>
  <g fill="#2B3138" fill-opacity="0.55">
    <circle cx="72" cy="96" r="6"/><circle cx="113" cy="95" r="6"/><circle cx="167" cy="101" r="6"/>
    <circle cx="188" cy="145" r="6"/><circle cx="147" cy="141" r="6"/><circle cx="98" cy="140" r="6"/>
    <circle cx="62" cy="151" r="6"/><circle cx="78" cy="200" r="6"/><circle cx="127" cy="186" r="6"/>
    <circle cx="168" cy="195" r="6"/><circle cx="197" cy="221" r="6"/><circle cx="128" cy="228" r="6"/>
  </g>
  <text x="125" y="270" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">Routine H&amp;E section</text>

  <!-- model -->
  <line x1="226" y1="153" x2="244" y2="153" stroke="#2B3138" stroke-width="2"/>
  <polygon points="244,147 254,153 244,159" fill="#2B3138"/>
  <rect x="256" y="118" width="128" height="70" rx="12" fill="#1E5FA8"/>
  <text x="320" y="148" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Hist2Prot</text>
  <text x="320" y="170" font-size="13" fill="#FFFFFF" text-anchor="middle">deep learning</text>
  <line x1="386" y1="153" x2="404" y2="153" stroke="#2B3138" stroke-width="2"/>
  <polygon points="404,147 414,153 404,159" fill="#2B3138"/>

  <!-- same cells, now with virtual protein phenotypes -->
  <rect x="420" y="58" width="190" height="190" rx="10" fill="#F5F7F9" stroke="#8A949E" stroke-width="1.5"/>
  <g fill="#C8323F">
    <circle cx="490" cy="138" r="17"/><circle cx="535" cy="143" r="17"/><circle cx="515" cy="188" r="17"/>
    <circle cx="470" cy="198" r="17"/><circle cx="560" cy="193" r="17"/>
  </g>
  <g fill="#3C9A2E">
    <circle cx="460" cy="98" r="17"/><circle cx="505" cy="93" r="17"/><circle cx="450" cy="153" r="17"/>
    <circle cx="585" cy="223" r="17"/>
  </g>
  <g fill="#D98A00">
    <circle cx="555" cy="103" r="17"/><circle cx="580" cy="143" r="17"/><circle cx="520" cy="226" r="17"/>
  </g>
  <text x="515" y="270" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">Virtual protein profiles</text>

  <!-- legend -->
  <circle cx="218" cy="294" r="7" fill="#C8323F"/><text x="231" y="299" font-size="13" fill="#2B3138">Tumour</text>
  <circle cx="302" cy="294" r="7" fill="#3C9A2E"/><text x="315" y="299" font-size="13" fill="#2B3138">Immune</text>
  <circle cx="388" cy="294" r="7" fill="#D98A00"/><text x="401" y="299" font-size="13" fill="#2B3138">Stromal</text>

  <!-- numbers stated in the abstract -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="322" width="186" height="56" rx="8" fill="#FFFFFF" stroke="#1E5FA8" stroke-width="1.5"/>
    <text x="123" y="345" font-weight="bold" fill="#1E5FA8">Training</text>
    <text x="123" y="365" fill="#2B3138">~51M paired cells (G4X)</text>
    <rect x="227" y="322" width="186" height="56" rx="8" fill="#FFFFFF" stroke="#1E5FA8" stroke-width="1.5"/>
    <text x="320" y="345" font-weight="bold" fill="#1E5FA8">Evaluation</text>
    <text x="320" y="365" fill="#2B3138">~72M further cells</text>
    <rect x="424" y="322" width="186" height="56" rx="8" fill="#FFFFFF" stroke="#3C9A2E" stroke-width="1.5"/>
    <text x="517" y="345" font-weight="bold" fill="#3C9A2E">Clinical prediction</text>
    <text x="517" y="365" fill="#2B3138">7 cohorts, 1,774 patients</text>
  </g>
</svg>
