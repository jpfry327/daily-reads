<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="30" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">Superb-seq: edits and RNA, same cell</text>
  <text x="320" y="52" font-size="13" fill="#8A949E" text-anchor="middle">Cas9 + T7 in situ transcription + scRNA-seq</text>

  <!-- One cell -->
  <ellipse cx="190" cy="215" rx="170" ry="140" fill="#F3F5F7" stroke="#8A949E" stroke-width="2"/>
  <text x="70" y="104" font-size="14" font-weight="bold" fill="#8A949E">one cell</text>

  <!-- On-target locus -->
  <line x1="50" y1="160" x2="300" y2="160" stroke="#2B3138" stroke-width="4"/>
  <rect x="80" y="152" width="60" height="16" fill="#1E5FA8"/>
  <text x="110" y="145" font-size="13" fill="#1E5FA8" text-anchor="middle">remodeler gene</text>
  <path d="M168 146 L176 160 L168 174" fill="none" stroke="#C8323F" stroke-width="3"/>
  <rect x="180" y="150" width="36" height="20" rx="3" fill="#D98A00"/>
  <text x="198" y="165" font-size="13" fill="#FFFFFF" text-anchor="middle">T7</text>
  <text x="250" y="145" font-size="13" fill="#C8323F" text-anchor="middle">on-target</text>
  <path d="M216 168 Q236 190 256 186" fill="none" stroke="#D98A00" stroke-width="2.5"/>
  <text x="262" y="200" font-size="13" fill="#D98A00">edit tag</text>

  <!-- Off-target locus -->
  <line x1="50" y1="250" x2="300" y2="250" stroke="#2B3138" stroke-width="4"/>
  <path d="M118 236 L126 250 L118 264" fill="none" stroke="#C8323F" stroke-width="3"/>
  <rect x="130" y="240" width="36" height="20" rx="3" fill="#D98A00"/>
  <text x="148" y="255" font-size="13" fill="#FFFFFF" text-anchor="middle">T7</text>
  <text x="230" y="240" font-size="13" fill="#C8323F" text-anchor="middle">off-target site</text>
  <path d="M166 258 Q186 280 206 276" fill="none" stroke="#D98A00" stroke-width="2.5"/>
  <text x="212" y="290" font-size="13" fill="#D98A00">edit tag</text>

  <!-- mRNAs -->
  <path d="M80 310 q10 -8 20 0 t20 0 t20 0" fill="none" stroke="#3C9A2E" stroke-width="2.5"/>
  <path d="M160 320 q10 -8 20 0 t20 0 t20 0" fill="none" stroke="#3C9A2E" stroke-width="2.5"/>
  <path d="M240 306 q10 -8 20 0 t20 0" fill="none" stroke="#3C9A2E" stroke-width="2.5"/>
  <text x="160" y="345" font-size="13" fill="#3C9A2E" text-anchor="middle">transcriptome</text>

  <!-- arrow -->
  <line x1="366" y1="215" x2="398" y2="215" stroke="#2B3138" stroke-width="2"/>
  <polygon points="406,215 396,209 396,221" fill="#2B3138"/>
  <text x="386" y="200" font-size="13" fill="#2B3138" text-anchor="middle">barcode</text>

  <!-- Readout -->
  <text x="520" y="96" font-size="15" font-weight="bold" fill="#2B3138" text-anchor="middle">Per-cell readout</text>
  <rect x="414" y="112" width="212" height="88" rx="8" fill="none" stroke="#1E5FA8" stroke-width="2"/>
  <text x="426" y="138" font-size="14" font-weight="bold" fill="#1E5FA8">On-target edit</text>
  <text x="426" y="162" font-size="13" fill="#2B3138">better effect estimates</text>
  <text x="426" y="182" font-size="13" fill="#2B3138">than Perturb-seq</text>

  <rect x="414" y="214" width="212" height="88" rx="8" fill="none" stroke="#C8323F" stroke-width="2"/>
  <text x="426" y="240" font-size="14" font-weight="bold" fill="#C8323F">Off-target edit</text>
  <text x="426" y="264" font-size="13" fill="#2B3138">19 tied to expression</text>
  <text x="426" y="284" font-size="13" fill="#2B3138">changes, 9 cell-type specific</text>

  <text x="520" y="332" font-size="13" fill="#8A949E" text-anchor="middle">35,000 cells, 3 cell lines</text>
  <text x="320" y="384" font-size="13" fill="#8A949E" text-anchor="middle">K562: all on-target sites and 36 off-target sites found</text>
</svg>
