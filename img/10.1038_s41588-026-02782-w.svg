<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B3138"/></marker></defs>
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#2B3138">ecDNA in micronuclei limits fitness</text>
<!-- panel 1 -->
<rect x="14" y="54" width="190" height="210" rx="12" fill="#D98A00" fill-opacity="0.07" stroke="#D98A00" stroke-width="2"/>
<text x="109" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#D98A00">Replication stress</text>
<g fill="none" stroke="#1E5FA8" stroke-width="5"><circle cx="70" cy="130" r="17"/><circle cx="128" cy="118" r="17"/><circle cx="160" cy="172" r="17"/><circle cx="92" cy="190" r="17"/></g>
<path d="M115 106 l8 10 l-6 2 l9 11" fill="none" stroke="#C8323F" stroke-width="3.5" stroke-linejoin="round"/>
<text x="109" y="238" text-anchor="middle" font-size="13" fill="#2B3138">ecDNA gets damaged</text>
<path d="M206 160 L232 160" stroke="#2B3138" stroke-width="2.5" marker-end="url(#ar)"/>
<!-- panel 2 -->
<rect x="236" y="54" width="190" height="210" rx="12" fill="#1E5FA8" fill-opacity="0.06" stroke="#1E5FA8" stroke-width="2"/>
<text x="331" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#1E5FA8">Mitosis</text>
<ellipse cx="331" cy="158" rx="78" ry="52" fill="#fff" stroke="#8A949E" stroke-width="2"/>
<line x1="331" y1="112" x2="331" y2="204" stroke="#8A949E" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="296" y="140" width="36" height="22" rx="11" fill="#2B3138" fill-opacity="0.15" stroke="#2B3138" stroke-width="1.5"/>
<g fill="none" stroke="#1E5FA8" stroke-width="4"><circle cx="352" cy="148" r="8"/><circle cx="366" cy="164" r="8"/><circle cx="350" cy="174" r="8"/></g>
<text x="331" y="238" text-anchor="middle" font-size="13" fill="#2B3138">ecDNA splits unevenly</text>
<path d="M428 160 L454 160" stroke="#2B3138" stroke-width="2.5" marker-end="url(#ar)"/>
<!-- panel 3 -->
<rect x="458" y="54" width="168" height="210" rx="12" fill="#C8323F" fill-opacity="0.06" stroke="#C8323F" stroke-width="2"/>
<text x="542" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#C8323F">Daughter cell</text>
<ellipse cx="542" cy="150" rx="62" ry="46" fill="#fff" stroke="#8A949E" stroke-width="2"/>
<ellipse cx="520" cy="146" rx="32" ry="24" fill="#2B3138" fill-opacity="0.15" stroke="#2B3138" stroke-width="1.5"/>
<text x="520" y="151" text-anchor="middle" font-size="13" fill="#2B3138">nucleus</text>
<circle cx="578" cy="166" r="15" fill="#1E5FA8" fill-opacity="0.2" stroke="#1E5FA8" stroke-width="3"/>
<g fill="none" stroke="#1E5FA8" stroke-width="3"><circle cx="574" cy="162" r="5"/><circle cx="583" cy="170" r="5"/></g>
<text x="542" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#1E5FA8">micronucleus</text>
<text x="542" y="244" text-anchor="middle" font-size="13" fill="#2B3138">with ecDNA</text>
<!-- outcomes -->
<path d="M542 266 L542 292" stroke="#2B3138" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="400" y="296" width="226" height="40" rx="20" fill="#C8323F"/>
<text x="513" y="321" text-anchor="middle" font-size="14" fill="#fff">Less output, more cell death</text>
<rect x="14" y="296" width="372" height="86" rx="12" fill="#3C9A2E" fill-opacity="0.08" stroke="#3C9A2E" stroke-width="2"/>
<text x="200" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#2B3138">MYCN-amplified neuroblastoma</text>
<text x="200" y="346" text-anchor="middle" font-size="14" fill="#2B3138">More ecDNA micronuclei at diagnosis</text>
<text x="200" y="368" text-anchor="middle" font-size="14" fill="#3C9A2E" font-weight="700">goes with better survival</text>
</svg>
