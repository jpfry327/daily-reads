<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="30" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">STAVAG: genes that follow an axis</text>
  <text x="320" y="52" font-size="13" fill="#8A949E" text-anchor="middle">spatial axis in a tumour, time axis in tissue</text>
  <!-- spatial tissue -->
  <text x="30" y="84" font-size="14" font-weight="bold" fill="#2B3138">Spatial: directionally variable genes</text>
  <ellipse cx="150" cy="170" rx="120" ry="64" fill="#F3F5F7" stroke="#8A949E" stroke-width="2"/>
  <path d="M60 170 Q85 120 110 126 Q112 170 110 214 Q85 220 60 170Z" fill="#C8323F" opacity="0.35"/>
  <path d="M110 126 Q150 112 190 126 Q192 170 190 214 Q150 228 110 214 Q112 170 110 126Z" fill="#D98A00" opacity="0.35"/>
  <path d="M190 126 Q220 120 240 170 Q220 220 190 214 Q192 170 190 126Z" fill="#3C9A2E" opacity="0.35"/>
  <text x="84" y="175" font-size="13" fill="#2B3138" text-anchor="middle">malignant</text>
  <text x="150" y="175" font-size="13" fill="#2B3138" text-anchor="middle">immune</text>
  <text x="215" y="175" font-size="13" fill="#2B3138" text-anchor="middle">stroma</text>
  <path d="M50 250 L250 250" stroke="#1E5FA8" stroke-width="3"/>
  <path d="M250 250 L238 243 M250 250 L238 257" stroke="#1E5FA8" stroke-width="3"/>
  <text x="150" y="274" font-size="13" fill="#1E5FA8" text-anchor="middle">biological axis through the tumour</text>
  <!-- SVG vs DVG cards -->
  <rect x="30" y="292" width="130" height="92" rx="8" fill="#FFFFFF" stroke="#8A949E" stroke-width="2"/>
  <text x="95" y="314" font-size="13" font-weight="bold" fill="#8A949E" text-anchor="middle">SVG</text>
  <circle cx="55" cy="334" r="6" fill="#8A949E"/><circle cx="85" cy="350" r="6" fill="#8A949E"/><circle cx="112" cy="332" r="6" fill="#8A949E"/><circle cx="135" cy="352" r="6" fill="#8A949E"/>
  <text x="95" y="372" font-size="13" fill="#2B3138" text-anchor="middle">any pattern</text>
  <rect x="180" y="292" width="130" height="92" rx="8" fill="#FFFFFF" stroke="#1E5FA8" stroke-width="2.5"/>
  <text x="245" y="314" font-size="13" font-weight="bold" fill="#1E5FA8" text-anchor="middle">DVG</text>
  <circle cx="205" cy="352" r="6" fill="#1E5FA8"/><circle cx="232" cy="346" r="6" fill="#1E5FA8"/><circle cx="258" cy="334" r="6" fill="#1E5FA8"/><circle cx="285" cy="330" r="6" fill="#1E5FA8"/>
  <text x="245" y="372" font-size="13" fill="#2B3138" text-anchor="middle">follows the axis</text>
  <!-- divider -->
  <path d="M340 80 L340 380" stroke="#8A949E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- temporal -->
  <text x="360" y="84" font-size="14" font-weight="bold" fill="#2B3138">Temporal: variable genes over time</text>
  <path d="M370 150 L600 150" stroke="#D98A00" stroke-width="3"/>
  <path d="M600 150 L588 143 M600 150 L588 157" stroke="#D98A00" stroke-width="3"/>
  <circle cx="395" cy="150" r="9" fill="#D98A00"/><circle cx="485" cy="150" r="9" fill="#D98A00"/><circle cx="575" cy="150" r="9" fill="#D98A00"/>
  <text x="485" y="124" font-size="13" fill="#D98A00" text-anchor="middle">time</text>
  <rect x="360" y="190" width="250" height="52" rx="8" fill="#F3F5F7" stroke="#C8323F" stroke-width="2"/>
  <text x="485" y="213" font-size="13" font-weight="bold" fill="#C8323F" text-anchor="middle">Myocardial infarction</text>
  <text x="485" y="232" font-size="13" fill="#2B3138" text-anchor="middle">ultra-acute-phase TVGs</text>
  <rect x="360" y="256" width="250" height="52" rx="8" fill="#F3F5F7" stroke="#3C9A2E" stroke-width="2"/>
  <text x="485" y="279" font-size="13" font-weight="bold" fill="#3C9A2E" text-anchor="middle">Mouse placentation</text>
  <text x="485" y="298" font-size="13" fill="#2B3138" text-anchor="middle">global and local modules</text>
  <rect x="360" y="322" width="250" height="52" rx="8" fill="#F3F5F7" stroke="#1E5FA8" stroke-width="2"/>
  <text x="485" y="345" font-size="13" font-weight="bold" fill="#1E5FA8" text-anchor="middle">Mouse embryo</text>
  <text x="485" y="364" font-size="13" fill="#2B3138" text-anchor="middle">tissue-specific TVG modules</text>
</svg>
