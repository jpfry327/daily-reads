<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#FFFFFF"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2B3138">LuCaS+: lung cancer niches by subtype</text>
<!-- cohort strip -->
<rect x="40" y="48" width="448" height="30" rx="6" fill="#1E5FA8"/>
<rect x="488" y="48" width="112" height="30" rx="6" fill="#8A949E"/>
<text x="264" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Discovery: Berlin + Cologne, 364 patients</text>
<text x="544" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Munich, 90</text>
<text x="320" y="98" text-anchor="middle" font-size="13" fill="#8A949E">Over 2.5 million single nuclei, long-term follow-up</text>
<!-- LUAD panel -->
<rect x="24" y="112" width="286" height="270" rx="10" fill="#F5F7FA" stroke="#8A949E" stroke-width="1.5"/>
<text x="167" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B3138">Adenocarcinoma</text>
<!-- tumour cluster -->
<g fill="#C8323F">
<circle cx="150" cy="224" r="15"/><circle cx="180" cy="224" r="15"/><circle cx="165" cy="250" r="15"/><circle cx="165" cy="198" r="15"/>
</g>
<text x="167" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#C8323F">Tumour cells</text>
<!-- monocyte -->
<circle cx="66" cy="186" r="17" fill="#D98A00"/>
<path d="M58 182 C62 174 72 174 74 184 C72 192 62 192 58 182 Z" fill="#FFFFFF" fill-opacity="0.7"/>
<text x="66" y="160" text-anchor="middle" font-size="13" fill="#2B3138">Monocyte</text>
<path d="M85 194 L128 212" stroke="#D98A00" stroke-width="2.5"/>
<polygon points="137,216 123,217 128,205" fill="#D98A00"/>
<!-- fibroblast -->
<path d="M236 190 C256 170 280 176 296 166 C286 184 290 200 268 208 C254 212 240 206 236 190 Z" fill="#3C9A2E"/>
<text x="266" y="156" text-anchor="middle" font-size="13" fill="#2B3138">Fibroblast</text>
<path d="M238 204 L206 216" stroke="#3C9A2E" stroke-width="2.5"/>
<polygon points="197,219 208,210 212,222" fill="#3C9A2E"/>
<text x="167" y="320" text-anchor="middle" font-size="13" fill="#2B3138">Monocyte- and fibroblast-</text>
<text x="167" y="338" text-anchor="middle" font-size="13" fill="#2B3138">driven inflammation</text>
<text x="167" y="366" text-anchor="middle" font-size="13" fill="#8A949E">Metastasis-prone cells: prognostic</text>
<!-- LUSC panel -->
<rect x="330" y="112" width="286" height="270" rx="10" fill="#F5F7FA" stroke="#8A949E" stroke-width="1.5"/>
<text x="473" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B3138">Squamous carcinoma</text>
<!-- tumour cluster left -->
<g fill="#C8323F">
<rect x="358" y="196" width="26" height="26" rx="5"/><rect x="386" y="196" width="26" height="26" rx="5"/>
<rect x="358" y="224" width="26" height="26" rx="5"/><rect x="386" y="224" width="26" height="26" rx="5"/>
</g>
<text x="385" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#C8323F">Tumour cells</text>
<!-- vessel right -->
<path d="M566 170 C552 196 580 226 566 256" fill="none" stroke="#1E5FA8" stroke-width="16" stroke-linecap="round"/>
<path d="M566 170 C552 196 580 226 566 256" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
<text x="566" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E5FA8">Vessels</text>
<!-- feedback loop arrows -->
<path d="M418 200 C456 170 506 170 540 196" fill="none" stroke="#2B3138" stroke-width="2.5"/>
<polygon points="548,203 534,200 542,189" fill="#2B3138"/>
<text x="480" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B3138">VEGF</text>
<path d="M544 232 C508 258 458 258 424 236" fill="none" stroke="#2B3138" stroke-width="2.5"/>
<polygon points="416,230 430,232 423,243" fill="#2B3138"/>
<text x="484" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B3138">TGFβ</text>
<text x="473" y="320" text-anchor="middle" font-size="13" fill="#2B3138">VEGF-TGFβ angiogenic</text>
<text x="473" y="338" text-anchor="middle" font-size="13" fill="#2B3138">feedback loop</text>
<text x="473" y="366" text-anchor="middle" font-size="13" fill="#8A949E">Direction of signals: schematic</text>
</svg>
