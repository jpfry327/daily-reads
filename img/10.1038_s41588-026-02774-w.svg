<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#2B3138">Scar macrophages in liver fibrosis</text>
<!-- healthy panel -->
<rect x="30" y="60" width="180" height="250" rx="10" fill="#3C9A2E" fill-opacity="0.08" stroke="#3C9A2E" stroke-width="2"/>
<text x="120" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#3C9A2E">Healthy liver</text>
<g fill="#3C9A2E" fill-opacity="0.75"><circle cx="70" cy="140" r="16"/><circle cx="130" cy="130" r="16"/><circle cx="170" cy="180" r="16"/><circle cx="90" cy="210" r="16"/><circle cx="140" cy="260" r="16"/></g>
<text x="120" y="296" text-anchor="middle" font-size="13" fill="#2B3138">healthy donors</text>
<!-- CLD panel -->
<rect x="240" y="60" width="370" height="250" rx="10" fill="#C8323F" fill-opacity="0.06" stroke="#C8323F" stroke-width="2"/>
<text x="425" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#C8323F">Chronic liver disease</text>
<!-- scar band -->
<path d="M270 190 Q 350 140 430 190 T 590 170 L590 220 Q 510 240 430 225 T 270 240 Z" fill="#8A949E" fill-opacity="0.4"/>
<text x="430" y="212" text-anchor="middle" font-size="14" fill="#2B3138">fibrotic niche</text>
<!-- SAMac -->
<g><circle cx="320" cy="160" r="25" fill="#D98A00"/><text x="320" y="165" text-anchor="middle" font-size="12" fill="#fff">TREM2</text>
<circle cx="520" cy="152" r="25" fill="#D98A00"/><text x="520" y="157" text-anchor="middle" font-size="12" fill="#fff">TREM2</text></g>
<g><circle cx="400" cy="262" r="20" fill="#C8323F"/><text x="400" y="267" text-anchor="middle" font-size="13" fill="#fff">OLR1</text>
<circle cx="480" cy="268" r="20" fill="#C8323F"/><text x="480" y="273" text-anchor="middle" font-size="13" fill="#fff">OLR1</text></g>
<text x="425" y="106" text-anchor="middle" font-size="13" fill="#2B3138">scar-associated macrophages</text>
<text x="425" y="124" text-anchor="middle" font-size="13" fill="#C8323F">pro-inflammatory OLR1+ type</text>
<!-- intervention -->
<rect x="30" y="332" width="580" height="52" rx="8" fill="#fff" stroke="#1E5FA8" stroke-width="2"/>
<text x="50" y="355" font-size="14" fill="#2B3138">Atlas of 649,295 cells, healthy and diseased livers</text>
<text x="50" y="375" font-size="14" fill="#1E5FA8">Targeting macrophage OLR1 → less fibrogenic activity in culture models</text>
</svg>
