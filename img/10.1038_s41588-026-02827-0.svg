<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#2B3138">Same GTEx data, different eQTL calls</text>
<rect x="30" y="60" width="150" height="46" rx="8" fill="#fff" stroke="#8A949E" stroke-width="2"/>
<text x="105" y="88" text-anchor="middle" font-size="15" fill="#2B3138">Same RNA-seq</text>
<rect x="30" y="140" width="150" height="46" rx="8" fill="#fff" stroke="#1E5FA8" stroke-width="3"/>
<text x="105" y="168" text-anchor="middle" font-size="14" fill="#1E5FA8" font-weight="700">Annotation A + tool 1</text>
<rect x="30" y="206" width="150" height="46" rx="8" fill="#fff" stroke="#3C9A2E" stroke-width="3"/>
<text x="105" y="234" text-anchor="middle" font-size="14" fill="#3C9A2E" font-weight="700">Annotation B + tool 2</text>
<line x1="105" y1="106" x2="105" y2="138" stroke="#8A949E" stroke-width="2"/>
<line x1="105" y1="106" x2="60" y2="106" stroke="#8A949E" stroke-width="2"/>
<text x="105" y="290" text-anchor="middle" font-size="13" fill="#8A949E">quantification choice</text>
<circle cx="330" cy="190" r="86" fill="#1E5FA8" fill-opacity="0.25" stroke="#1E5FA8" stroke-width="3"/>
<circle cx="440" cy="190" r="86" fill="#3C9A2E" fill-opacity="0.25" stroke="#3C9A2E" stroke-width="3"/>
<text x="285" y="195" text-anchor="middle" font-size="14" fill="#2B3138">only A</text>
<text x="385" y="187" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3138">shared</text>
<text x="485" y="195" text-anchor="middle" font-size="14" fill="#2B3138">only B</text>
<text x="385" y="320" text-anchor="middle" font-size="16" font-weight="700" fill="#2B3138">eQTL, colocalization, TWAS calls</text>
<text x="385" y="344" text-anchor="middle" font-size="13" fill="#8A949E">overlap is largest for long, multi-isoform genes</text>
<path d="M190 163 L238 180" stroke="#1E5FA8" stroke-width="2.5" fill="none"/>
<path d="M190 229 L238 205" stroke="#3C9A2E" stroke-width="2.5" fill="none"/>
</svg>
