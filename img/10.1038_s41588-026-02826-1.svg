<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="30" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">SIQReg: choosing the phenotype scale</text>
  <text x="320" y="52" font-size="13" fill="#8A949E" text-anchor="middle">minimise heterogeneity of genetic effects across phenotype quantiles</text>

  <!-- scale axis -->
  <line x1="70" y1="104" x2="570" y2="104" stroke="#2B3138" stroke-width="3"/>
  <circle cx="70" cy="104" r="9" fill="#8A949E"/>
  <circle cx="570" cy="104" r="9" fill="#8A949E"/>
  <circle cx="340" cy="104" r="11" fill="#1E5FA8"/>
  <text x="70" y="136" font-size="13" fill="#2B3138" text-anchor="middle">default scale</text>
  <text x="70" y="154" font-size="13" fill="#8A949E" text-anchor="middle">purely additive</text>
  <text x="570" y="136" font-size="13" fill="#2B3138" text-anchor="middle">log scale</text>
  <text x="570" y="154" font-size="13" fill="#8A949E" text-anchor="middle">purely multiplicative</text>
  <text x="340" y="82" font-size="14" font-weight="bold" fill="#1E5FA8" text-anchor="middle">SIQReg scale</text>
  <text x="340" y="136" font-size="13" fill="#1E5FA8" text-anchor="middle">learned from data</text>
  <text x="340" y="154" font-size="13" fill="#1E5FA8" text-anchor="middle">in between</text>

  <!-- left panel: default -->
  <rect x="40" y="180" width="270" height="150" rx="6" fill="#F3F5F7" stroke="#C8323F" stroke-width="2"/>
  <text x="175" y="202" font-size="14" font-weight="bold" fill="#C8323F" text-anchor="middle">Default scale</text>
  <text x="62" y="222" font-size="13" fill="#2B3138">variant effect by quantile</text>
  <g stroke="#C8323F" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M70 300 L280 250"/><path d="M70 300 L280 280"/><path d="M70 300 L280 310" opacity="0"/>
    <path d="M70 300 L280 232"/>
  </g>
  <g stroke="#8A949E" stroke-width="2" fill="none"><path d="M70 235 V305 H285"/></g>
  <text x="175" y="324" font-size="13" fill="#2B3138" text-anchor="middle">fan-out looks nonadditive</text>

  <!-- right panel: SIQReg -->
  <rect x="330" y="180" width="270" height="150" rx="6" fill="#F3F5F7" stroke="#3C9A2E" stroke-width="2"/>
  <text x="465" y="202" font-size="14" font-weight="bold" fill="#3C9A2E" text-anchor="middle">SIQReg scale</text>
  <text x="352" y="222" font-size="13" fill="#2B3138">variant effect by quantile</text>
  <g stroke="#3C9A2E" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M360 300 L570 262"/><path d="M360 288 L570 250"/><path d="M360 276 L570 238"/>
  </g>
  <g stroke="#8A949E" stroke-width="2" fill="none"><path d="M360 235 V305 H575"/></g>
  <text x="465" y="324" font-size="13" fill="#2B3138" text-anchor="middle">parallel: scale artefact gone</text>

  <!-- arrow between -->
  <path d="M312 255 L328 255" stroke="#2B3138" stroke-width="2" fill="none"/>
  <path d="M328 255 l-7 -5 v10 z" fill="#2B3138"/>

  <text x="320" y="362" font-size="13" fill="#2B3138" text-anchor="middle">Most variance QTLs vanish; GWAS, TWAS and polygenic scores improve</text>
  <text x="320" y="382" font-size="13" fill="#8A949E" text-anchor="middle">25 UK Biobank complex traits</text>
</svg>
