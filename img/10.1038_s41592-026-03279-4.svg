<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="30" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">Echidna: CNAs from two data types</text>
  <text x="320" y="52" font-size="13" fill="#8A949E" text-anchor="middle">jointly across samples and time points</text>

  <!-- Input 1: scRNA-seq -->
  <rect x="20" y="72" width="190" height="130" rx="10" fill="none" stroke="#1E5FA8" stroke-width="2"/>
  <text x="115" y="94" font-size="15" font-weight="bold" fill="#1E5FA8" text-anchor="middle">scRNA-seq</text>
  <g fill="#1E5FA8">
    <circle cx="48" cy="118" r="8"/><circle cx="72" cy="122" r="8"/><circle cx="58" cy="142" r="8"/><circle cx="84" cy="146" r="8"/>
  </g>
  <g fill="#D98A00">
    <circle cx="128" cy="116" r="8"/><circle cx="150" cy="126" r="8"/><circle cx="134" cy="142" r="8"/><circle cx="160" cy="150" r="8"/><circle cx="182" cy="132" r="8"/>
  </g>
  <g fill="#3C9A2E">
    <circle cx="70" cy="174" r="8"/><circle cx="96" cy="178" r="8"/><circle cx="120" cy="174" r="8"/>
  </g>
  <text x="160" y="188" font-size="13" fill="#2B3138" text-anchor="middle">cell states</text>

  <!-- Input 2: bulk WGS -->
  <rect x="20" y="222" width="190" height="130" rx="10" fill="none" stroke="#C8323F" stroke-width="2"/>
  <text x="115" y="244" font-size="15" font-weight="bold" fill="#C8323F" text-anchor="middle">Bulk WGS</text>
  <line x1="36" y1="300" x2="194" y2="300" stroke="#8A949E" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M36 300 H70 V276 H112 V300 H140 V320 H170 V300 H194" fill="none" stroke="#2B3138" stroke-width="3"/>
  <text x="91" y="268" font-size="13" fill="#C8323F" text-anchor="middle">gain</text>
  <text x="155" y="338" font-size="13" fill="#1E5FA8" text-anchor="middle">loss</text>

  <!-- arrows into model -->
  <path d="M212 137 L262 180" stroke="#2B3138" stroke-width="2" fill="none"/>
  <polygon points="262,180 251,177 257,170" fill="#2B3138"/>
  <path d="M212 287 L262 246" stroke="#2B3138" stroke-width="2" fill="none"/>
  <polygon points="262,246 257,256 251,249" fill="#2B3138"/>

  <!-- Bayesian hierarchical model: plates -->
  <rect x="266" y="110" width="160" height="210" rx="12" fill="#F3F5F7" stroke="#8A949E" stroke-width="1.5"/>
  <text x="346" y="134" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">Bayesian model</text>
  <circle cx="346" cy="170" r="22" fill="#FFFFFF" stroke="#2B3138" stroke-width="2"/>
  <text x="346" y="175" font-size="13" fill="#2B3138" text-anchor="middle">CNA</text>
  <rect x="280" y="214" width="62" height="86" rx="6" fill="none" stroke="#1E5FA8" stroke-width="1.5"/>
  <rect x="350" y="214" width="62" height="86" rx="6" fill="none" stroke="#1E5FA8" stroke-width="1.5"/>
  <text x="311" y="234" font-size="13" fill="#1E5FA8" text-anchor="middle">time 1</text>
  <text x="381" y="234" font-size="13" fill="#1E5FA8" text-anchor="middle">time 2</text>
  <circle cx="311" cy="270" r="15" fill="#FFFFFF" stroke="#2B3138" stroke-width="1.5"/>
  <circle cx="381" cy="270" r="15" fill="#FFFFFF" stroke="#2B3138" stroke-width="1.5"/>
  <text x="311" y="275" font-size="13" fill="#2B3138" text-anchor="middle">c</text>
  <text x="381" y="275" font-size="13" fill="#2B3138" text-anchor="middle">c</text>
  <line x1="336" y1="190" x2="316" y2="254" stroke="#2B3138" stroke-width="1.5"/>
  <line x1="356" y1="190" x2="376" y2="254" stroke="#2B3138" stroke-width="1.5"/>
  <text x="346" y="314" font-size="13" fill="#8A949E" text-anchor="middle">shared across samples</text>

  <!-- arrow to output -->
  <line x1="430" y1="215" x2="462" y2="215" stroke="#2B3138" stroke-width="2"/>
  <polygon points="470,215 460,209 460,221" fill="#2B3138"/>

  <!-- Output: clone tree linking CNAs to states -->
  <text x="550" y="96" font-size="15" font-weight="bold" fill="#2B3138" text-anchor="middle">Clones and states</text>
  <circle cx="550" cy="130" r="12" fill="#8A949E"/>
  <line x1="550" y1="142" x2="502" y2="192" stroke="#2B3138" stroke-width="2"/>
  <line x1="550" y1="142" x2="598" y2="192" stroke="#2B3138" stroke-width="2"/>
  <circle cx="502" cy="204" r="13" fill="#1E5FA8"/>
  <circle cx="598" cy="204" r="13" fill="#D98A00"/>
  <line x1="598" y1="217" x2="598" y2="246" stroke="#2B3138" stroke-width="2"/>
  <circle cx="598" cy="258" r="13" fill="#3C9A2E"/>
  <text x="502" y="240" font-size="13" fill="#2B3138" text-anchor="middle">clone A</text>
  <text x="560" y="196" font-size="13" fill="#C8323F" text-anchor="end">+gain</text>
  <text x="560" y="262" font-size="13" fill="#1E5FA8" text-anchor="end">−loss</text>
  <rect x="474" y="294" width="156" height="58" rx="8" fill="none" stroke="#3C9A2E" stroke-width="1.5"/>
  <text x="552" y="318" font-size="13" fill="#2B3138" text-anchor="middle">CNAs vs other</text>
  <text x="552" y="337" font-size="13" fill="#2B3138" text-anchor="middle">expression variation</text>
  <text x="320" y="384" font-size="13" fill="#8A949E" text-anchor="middle">Applied to patient tumours to study therapy resistance</text>
</svg>
