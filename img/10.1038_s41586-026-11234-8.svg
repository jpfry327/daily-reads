<text x="315" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#C8323F">Hypoxia</text>
<!-- subclone zoom -->
<circle cx="500" cy="155" r="76" fill="#FFFFFF" stroke="#8A949E" stroke-width="2"/>
<g fill="#2B3138"><circle cx="470" cy="120" r="7"/><circle cx="520" cy="108" r="7"/><circle cx="548" cy="150" r="7"/><circle cx="494" cy="162" r="7"/><circle cx="462" cy="188" r="7"/><circle cx="530" cy="196" r="7"/></g>
<g fill="#FFFFFF" stroke="#2B3138" stroke-width="2.5"><circle cx="496" cy="126" r="6"/><circle cx="470" cy="154" r="6"/><circle cx="526" cy="146" r="6"/><circle cx="512" cy="180" r="6"/><circle cx="486" cy="200" r="6"/><circle cx="548" cy="182" r="6"/></g>
<text x="500" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B3138">Subclones intermixed</text>
<text x="500" y="280" text-anchor="middle" font-size="13" fill="#8A949E">filled vs hollow = clone</text>
<!-- data layers -->
<g stroke="#1E5FA8" stroke-width="2" fill="#FFFFFF">
<rect x="120" y="304" width="120" height="30" rx="15"/><rect x="260" y="304" width="120" height="30" rx="15"/><rect x="400" y="304" width="120" height="30" rx="15"/>
</g>
<g font-size="13" text-anchor="middle" fill="#1E5FA8">
<text x="180" y="324">Transcriptome</text><text x="320" y="324">Epigenome</text><text x="460" y="324">Genome</text>
</g>
<text x="320" y="366" text-anchor="middle" font-size="14" fill="#2B3138">Paired profiling: 12 tumours, many regions</text>
</svg>
