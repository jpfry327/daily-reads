<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<defs><clipPath id="sec"><rect x="40" y="60" width="330" height="190" rx="28"/></clipPath></defs>
<rect width="640" height="400" fill="#FFFFFF"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2B3138">Glioblastoma: one spatial cell trajectory</text>
<!-- tumour section with three zones -->
<g clip-path="url(#sec)">
<rect x="40" y="60" width="110" height="190" fill="#D6E4F4"/>
<rect x="150" y="60" width="110" height="190" fill="#FBEBCC"/>
<rect x="260" y="60" width="110" height="190" fill="#F6D5D8"/>
</g>
<rect x="40" y="60" width="330" height="190" rx="28" fill="none" stroke="#8A949E" stroke-width="2"/>
<g fill="#1E5FA8"><circle cx="78" cy="100" r="6"/><circle cx="112" cy="132" r="6"/><circle cx="66" cy="208" r="6"/><circle cx="124" cy="220" r="6"/><circle cx="96" cy="170" r="6"/></g>
<g fill="#D98A00"><circle cx="182" cy="96" r="6"/><circle cx="226" cy="124" r="6"/><circle cx="176" cy="218" r="6"/><circle cx="238" cy="206" r="6"/><circle cx="208" cy="170" r="6"/></g>
<g fill="#C8323F"><circle cx="296" cy="100" r="6"/><circle cx="346" cy="134" r="6"/><circle cx="302" cy="226" r="6"/><circle cx="342" cy="200" r="6"/><circle cx="320" cy="168" r="6"/></g>
<path d="M62 156 Q205 120 346 160" fill="none" stroke="#2B3138" stroke-width="3"/>
<path d="M334 150 L350 161 L333 169" fill="#2B3138"/>
<text x="95" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E5FA8">Developmental-like</text>
