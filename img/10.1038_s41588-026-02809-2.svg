<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#2B3138">fastGxE: genotype x environment</text>
<text x="165" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#8A949E">Main effect only</text>
<text x="480" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#2B3138">Genotype x environment</text>
<!-- left plot -->
<g stroke="#2B3138" stroke-width="2.5" fill="none" stroke-linecap="round">
<path d="M50 290 H290"/><path d="M50 290 V96"/>
</g>
<path d="M62 212 L280 152" stroke="#1E5FA8" stroke-width="4" stroke-linecap="round"/>
<path d="M62 252 L280 192" stroke="#D98A00" stroke-width="4" stroke-linecap="round"/>
<text x="170" y="274" text-anchor="middle" font-size="13" fill="#2B3138">same gap in every environment</text>
<text x="170" y="312" text-anchor="middle" font-size="14" fill="#2B3138">environment</text>
<text x="26" y="196" text-anchor="middle" font-size="14" fill="#2B3138" transform="rotate(-90 26 196)">trait</text>
<!-- right plot -->
<g stroke="#2B3138" stroke-width="2.5" fill="none" stroke-linecap="round">
<path d="M365 290 H605"/><path d="M365 290 V96"/>
</g>
<path d="M377 200 L592 128" stroke="#1E5FA8" stroke-width="4" stroke-linecap="round"/>
<path d="M377 214 L592 248" stroke="#D98A00" stroke-width="4" stroke-linecap="round"/>
<path d="M592 138 V238" stroke="#C8323F" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="480" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#C8323F">effect differs by environment</text>
<text x="485" y="312" text-anchor="middle" font-size="14" fill="#2B3138">environment</text>
<!-- legend -->
<circle cx="205" cy="346" r="7" fill="#1E5FA8"/>
<text x="219" y="351" font-size="14" fill="#2B3138">genotype 1</text>
<circle cx="335" cy="346" r="7" fill="#D98A00"/>
<text x="349" y="351" font-size="14" fill="#2B3138">genotype 2</text>
<text x="320" y="384" text-anchor="middle" font-size="14" font-weight="700" fill="#3C9A2E">Genome-wide scan at biobank scale</text>
</svg>
