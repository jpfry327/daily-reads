<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="30" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">Hidden squamous state in cholangiocarcinoma</text>
  <text x="320" y="52" font-size="13" fill="#8A949E" text-anchor="middle">STP-high: about 20-30% of patients</text>

  <!-- tumour cell -->
  <rect x="30" y="66" width="260" height="254" rx="46" fill="#FBEEF0" stroke="#C8323F" stroke-width="2"/>
  <text x="160" y="92" font-size="14" font-weight="bold" fill="#C8323F" text-anchor="middle">Primed, histology-silent cell</text>

  <!-- nucleus with chromatin -->
  <ellipse cx="160" cy="180" rx="110" ry="66" fill="#FFFFFF" stroke="#8A949E" stroke-width="1.5"/>
  <text x="160" y="140" font-size="13" fill="#2B3138" text-anchor="middle">Chromatin reshaped</text>
  <line x1="66" y1="198" x2="254" y2="198" stroke="#8A949E" stroke-width="3"/>
  <rect x="72" y="193" width="96" height="10" fill="#D98A00"/>
  <rect x="192" y="190" width="52" height="16" fill="#1E5FA8"/>
  <ellipse cx="97" cy="176" rx="27" ry="13" fill="#C8323F"/>
  <text x="97" y="181" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FOSL1</text>
  <ellipse cx="146" cy="176" rx="21" ry="13" fill="#1E5FA8"/>
  <text x="146" y="181" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">p63</text>
  <path d="M168 170 Q196 156 214 182" fill="none" stroke="#2B3138" stroke-width="1.5"/>
  <polygon points="209,180 217,188 219,177" fill="#2B3138"/>
  <text x="120" y="222" font-size="13" fill="#D98A00" text-anchor="middle">enhancer</text>
  <text x="218" y="222" font-size="13" fill="#1E5FA8" text-anchor="middle">PTGS2</text>

  <line x1="160" y1="248" x2="160" y2="264" stroke="#2B3138" stroke-width="2"/>
  <polygon points="154,264 160,274 166,264" fill="#2B3138"/>
  <text x="160" y="292" font-size="15" font-weight="bold" fill="#C8323F" text-anchor="middle">COX-2 up</text>

  <!-- celecoxib blocks COX-2 -->
  <line x1="160" y1="346" x2="160" y2="302" stroke="#3C9A2E" stroke-width="3"/>
  <line x1="144" y1="301" x2="176" y2="301" stroke="#3C9A2E" stroke-width="3"/>
  <rect x="102" y="346" width="116" height="32" rx="16" fill="#3C9A2E"/>
  <text x="160" y="367" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Celecoxib</text>
  <text x="230" y="367" font-size="13" fill="#8A949E">from drug-repurposing screen</text>

  <!-- PGE2 leaves the cell -->
  <circle cx="304" cy="180" r="5" fill="#D98A00"/><circle cx="321" cy="174" r="5" fill="#D98A00"/>
  <circle cx="337" cy="184" r="5" fill="#D98A00"/><circle cx="352" cy="176" r="5" fill="#D98A00"/>
  <text x="328" y="158" font-size="13" font-weight="bold" fill="#D98A00" text-anchor="middle">PGE2</text>

  <!-- neutrophil -->
  <circle cx="400" cy="180" r="31" fill="#FBF1DC" stroke="#D98A00" stroke-width="2"/>
  <path d="M386 174 q8 -12 16 0 q8 12 14 -2" fill="none" stroke="#D98A00" stroke-width="5" stroke-linecap="round"/>
  <text x="400" y="232" font-size="13" fill="#2B3138" text-anchor="middle">Neutrophil</text>

  <line x1="436" y1="180" x2="470" y2="180" stroke="#2B3138" stroke-width="2"/>
  <polygon points="470,174 480,180 470,186" fill="#2B3138"/>

  <!-- Tr1 cell -->
  <circle cx="516" cy="180" r="31" fill="#E4EDF7" stroke="#1E5FA8" stroke-width="2"/>
  <text x="516" y="186" font-size="15" font-weight="bold" fill="#1E5FA8" text-anchor="middle">Tr1</text>
  <text x="516" y="232" font-size="13" fill="#2B3138" text-anchor="middle">FOXP3-negative Treg</text>
  <text x="458" y="124" font-size="13" fill="#8A949E" text-anchor="middle">Neutrophils polarise T cells</text>

  <line x1="516" y1="242" x2="516" y2="266" stroke="#2B3138" stroke-width="2"/>
  <polygon points="510,266 516,276 522,266" fill="#2B3138"/>
  <rect x="416" y="278" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C8323F" stroke-width="2"/>
  <text x="516" y="303" font-size="14" font-weight="bold" fill="#C8323F" text-anchor="middle">Immunotherapy resistance</text>
</svg>
