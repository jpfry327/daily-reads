<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B3138"/></marker></defs>
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#2B3138">A chromatin axis starts MYC amplification</text>
<!-- locus -->
<line x1="24" y1="190" x2="300" y2="190" stroke="#8A949E" stroke-width="5"/>
<rect x="128" y="172" width="70" height="36" rx="6" fill="#1E5FA8"/>
<text x="163" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">MYC</text>
<!-- H3K4me primes -->
<circle cx="110" cy="162" r="8" fill="#3C9A2E"/><circle cx="216" cy="162" r="8" fill="#3C9A2E"/>
<text x="163" y="124" text-anchor="middle" font-size="14" fill="#3C9A2E" font-weight="700">H3K4me primes</text>
<path d="M163 130 L163 166" stroke="#3C9A2E" stroke-width="2" marker-end="url(#a)"/>
<!-- KDM4C -->
<rect x="40" y="258" width="112" height="34" rx="17" fill="#D98A00"/>
<text x="96" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">KDM4C</text>
<path d="M120 258 L148 214" stroke="#2B3138" stroke-width="2.5" marker-end="url(#a)"/>
<text x="24" y="318" font-size="13" fill="#2B3138">erases H3K9/K36me3</text>
<text x="24" y="350" font-size="13" fill="#C8323F" font-weight="700">KDM4C inhibitor blocks it</text>
<!-- SETD2 -->
<rect x="196" y="258" width="104" height="34" rx="17" fill="#C8323F"/>
<text x="248" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">SETD2</text>
<path d="M232 258 L206 220" stroke="#C8323F" stroke-width="3"/><path d="M196 222 L214 212" stroke="#C8323F" stroke-width="4"/>
<text x="196" y="318" font-size="13" fill="#2B3138">restrains copy gains</text>
<!-- stages -->
<path d="M322 80 L322 372" stroke="#E3E6E9" stroke-width="2"/>
<text x="470" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#2B3138">Stepwise MYC copy gains</text>
<g fill="#1E5FA8"><rect x="350" y="104" width="34" height="14" rx="3"/><rect x="392" y="104" width="34" height="14" rx="3"/></g>
<text x="440" y="114" font-size="14" fill="#2B3138">diploid</text>
<path d="M388 126 L388 156" stroke="#2B3138" stroke-width="2" marker-end="url(#a)"/>
<g fill="#1E5FA8"><rect x="350" y="170" width="34" height="14" rx="3"/><rect x="392" y="170" width="34" height="14" rx="3"/><rect x="350" y="188" width="34" height="14" rx="3"/><rect x="392" y="188" width="34" height="14" rx="3"/></g>
<text x="440" y="190" font-size="14" fill="#2B3138">focal copy gains</text>
<path d="M388 210 L388 240" stroke="#2B3138" stroke-width="2" marker-end="url(#a)"/>
<g fill="none" stroke="#1E5FA8" stroke-width="5"><circle cx="366" cy="272" r="12"/><circle cx="404" cy="290" r="12"/><circle cx="436" cy="262" r="12"/></g>
<text x="462" y="280" font-size="14" fill="#2B3138">ecDNA and</text>
<text x="462" y="298" font-size="14" fill="#2B3138">inherited gains</text>
<!-- accelerators -->
<rect x="438" y="124" width="178" height="42" rx="8" fill="#D98A00" fill-opacity="0.12" stroke="#D98A00" stroke-width="2"/>
<text x="527" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#D98A00">TP53 loss or blocked</text>
<text x="527" y="159" text-anchor="middle" font-size="13" font-weight="700" fill="#D98A00">apoptosis speeds this up</text>
<text x="470" y="352" text-anchor="middle" font-size="13" fill="#2B3138">Cells carrying these changes are tumorigenic</text>
</svg>
