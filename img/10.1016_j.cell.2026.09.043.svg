<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<defs>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B3138"/></marker>
</defs>
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#2B3138">RNA recoding remodels squid proteins</text>
<!-- editing panel -->
<rect x="14" y="52" width="330" height="112" rx="12" fill="#1E5FA8" fill-opacity="0.06" stroke="#1E5FA8" stroke-width="2"/>
<text x="179" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#1E5FA8">Squid mRNA</text>
<line x1="28" y1="124" x2="330" y2="124" stroke="#8A949E" stroke-width="4"/>
<circle cx="100" cy="124" r="16" fill="#1E5FA8"/>
<text x="100" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">A</text>
<circle cx="258" cy="124" r="16" fill="#3C9A2E"/>
<text x="258" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">I</text>
<rect x="144" y="82" width="72" height="26" rx="13" fill="#D98A00"/>
<text x="180" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ADAR</text>
<path d="M122 124 L234 124" stroke="#2B3138" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="100" y="156" text-anchor="middle" font-size="13" fill="#2B3138">adenosine</text>
<text x="258" y="156" text-anchor="middle" font-size="13" fill="#2B3138">inosine</text>
<!-- proteomics panel -->
<rect x="356" y="52" width="270" height="112" rx="12" fill="#8A949E" fill-opacity="0.08" stroke="#8A949E" stroke-width="2"/>
<text x="491" y="86" text-anchor="middle" font-size="14" fill="#2B3138">Proteomics confirms</text>
<text x="491" y="114" text-anchor="middle" font-size="18" font-weight="700" fill="#2B3138">7,997 recoded sites</text>
<text x="491" y="142" text-anchor="middle" font-size="14" fill="#2B3138">translated into protein</text>
<path d="M179 166 L179 196" stroke="#2B3138" stroke-width="2.5" marker-end="url(#ar)"/>
<!-- protein -->
<ellipse cx="110" cy="244" rx="86" ry="38" fill="#8A949E" fill-opacity="0.15" stroke="#8A949E" stroke-width="2"/>
<text x="110" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3138">Recoded protein</text>
<circle cx="84" cy="250" r="11" fill="#C8323F"/>
<circle cx="138" cy="254" r="9" fill="#1E5FA8" fill-opacity="0.5"/>
<text x="84" y="298" text-anchor="middle" font-size="13" fill="#C8323F">changed residue</text>
<!-- consequences -->
<path d="M198 244 L248 244" stroke="#2B3138" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M256 216 V272" stroke="#2B3138" stroke-width="2.5"/>
<path d="M256 216 L276 216 M256 272 L276 272" stroke="#2B3138" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="280" y="198" width="170" height="36" rx="18" fill="#3C9A2E" fill-opacity="0.1" stroke="#3C9A2E" stroke-width="2"/>
<text x="365" y="221" text-anchor="middle" font-size="14" fill="#2B3138">Protein stability</text>
<rect x="458" y="198" width="168" height="36" rx="18" fill="#3C9A2E" fill-opacity="0.1" stroke="#3C9A2E" stroke-width="2"/>
<text x="542" y="221" text-anchor="middle" font-size="14" fill="#2B3138">Localization</text>
<rect x="280" y="254" width="170" height="36" rx="18" fill="#3C9A2E" fill-opacity="0.1" stroke="#3C9A2E" stroke-width="2"/>
<text x="365" y="277" text-anchor="middle" font-size="14" fill="#2B3138">PTM sites made/lost</text>
<rect x="458" y="254" width="168" height="36" rx="18" fill="#3C9A2E" fill-opacity="0.1" stroke="#3C9A2E" stroke-width="2"/>
<text x="542" y="277" text-anchor="middle" font-size="14" fill="#2B3138">Enzyme activity</text>
<!-- example -->
<text x="14" y="318" font-size="14" font-weight="700" fill="#2B3138">Example: MARCHF5 recoding</text>
<rect x="14" y="328" width="186" height="56" rx="12" fill="#1E5FA8" fill-opacity="0.08" stroke="#1E5FA8" stroke-width="2"/>
<text x="107" y="352" text-anchor="middle" font-size="14" fill="#2B3138">Recoded E3 ligase</text>
<text x="107" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#1E5FA8">MARCHF5</text>
<path d="M202 356 L228 356" stroke="#2B3138" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="232" y="328" width="176" height="56" rx="12" fill="#D98A00" fill-opacity="0.08" stroke="#D98A00" stroke-width="2"/>
<text x="320" y="352" text-anchor="middle" font-size="14" fill="#2B3138">Substrate</text>
<text x="320" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#D98A00">ubiquitylation shifts</text>
<path d="M410 356 L436 356" stroke="#2B3138" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="440" y="328" width="186" height="56" rx="12" fill="#C8323F" fill-opacity="0.08" stroke="#C8323F" stroke-width="2"/>
<text x="533" y="352" text-anchor="middle" font-size="14" fill="#2B3138">Mitochondrial</text>
<text x="533" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#C8323F">homeostasis perturbed</text>
</svg>
