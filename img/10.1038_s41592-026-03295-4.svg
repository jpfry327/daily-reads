<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#FFFFFF"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2B3138">PANGEA: one remapped atlas of human cells</text>
<!-- raw files from public repositories -->
<g fill="#FFFFFF" stroke="#8A949E" stroke-width="2">
<path d="M30 70 h34 l10 10 v38 h-44 z"/>
<path d="M44 84 h34 l10 10 v38 h-44 z"/>
<path d="M58 98 h34 l10 10 v38 h-44 z"/>
</g>
<path d="M66 118 h28 M66 128 h28 M66 138 h20" stroke="#8A949E" stroke-width="2"/>
<text x="66" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B3138">Raw public reads</text>
<text x="66" y="186" text-anchor="middle" font-size="13" fill="#8A949E">reprocessed uniformly</text>
<!-- arrow to core -->
<path d="M112 110 H150" stroke="#2B3138" stroke-width="2.5"/>
<polygon points="160,110 148,103 148,117" fill="#2B3138"/>
<!-- core atlas -->
<circle cx="208" cy="110" r="44" fill="#1E5FA8"/>
<text x="208" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Core atlas</text>
<text x="208" y="125" text-anchor="middle" font-size="13" fill="#FFFFFF">12.6M cells</text>
<!-- hierarchy tree -->
<path d="M252 110 H286" stroke="#2B3138" stroke-width="2.5"/>
<g fill="none" stroke="#8A949E" stroke-width="2">
<path d="M286 110 C306 110 306 70 326 70"/>
<path d="M286 110 H326"/>
<path d="M286 110 C306 110 306 150 326 150"/>
<path d="M338 70 C352 70 352 56 366 56"/><path d="M338 70 C352 70 352 84 366 84"/>
<path d="M338 110 C352 110 352 100 366 100"/><path d="M338 110 C352 110 352 122 366 122"/>
<path d="M338 150 C352 150 352 138 366 138"/><path d="M338 150 C352 150 352 164 366 164"/>
</g>
<circle cx="332" cy="70" r="8" fill="#3C9A2E"/><circle cx="332" cy="110" r="8" fill="#D98A00"/><circle cx="332" cy="150" r="8" fill="#C8323F"/>
<g fill="#3C9A2E"><circle cx="371" cy="56" r="5"/><circle cx="371" cy="84" r="5"/></g>
<g fill="#D98A00"><circle cx="371" cy="100" r="5"/><circle cx="371" cy="122" r="5"/></g>
<g fill="#C8323F"><circle cx="371" cy="138" r="5"/><circle cx="371" cy="164" r="5"/></g>
<text x="332" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B3138">32 major types</text>
<text x="392" y="114" font-size="13" font-weight="bold" fill="#2B3138">165 subtypes</text>
<!-- annotate the rest -->
<path d="M500 100 H526" stroke="#2B3138" stroke-width="2.5"/>
<polygon points="536,100 524,93 524,107" fill="#2B3138"/>
<rect x="540" y="58" width="88" height="96" rx="8" fill="#F5F7FA" stroke="#1E5FA8" stroke-width="2"/>
<text x="584" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E5FA8">46.5M cells</text>
<text x="584" y="104" text-anchor="middle" font-size="13" fill="#2B3138">160 diseases</text>
<text x="584" y="124" text-anchor="middle" font-size="13" fill="#2B3138">48 organs</text>
<text x="584" y="144" text-anchor="middle" font-size="13" fill="#8A949E">annotated</text>
<!-- divider -->
<path d="M30 212 H610" stroke="#8A949E" stroke-width="1" stroke-dasharray="4 4"/>
<text x="30" y="238" font-size="14" font-weight="bold" fill="#2B3138">Same disease-response archetype, different organs</text>
<!-- three organ panels with the same cell triad -->
<g>
<rect x="30" y="254" width="120" height="96" rx="48" fill="#F5F7FA" stroke="#8A949E" stroke-width="2"/>
<circle cx="74" cy="290" r="11" fill="#3C9A2E"/><circle cx="106" cy="290" r="11" fill="#D98A00"/><circle cx="90" cy="318" r="11" fill="#C8323F"/>
<path d="M85 290 H95 M79 300 L85 309 M101 300 L95 309" stroke="#2B3138" stroke-width="2"/>
<text x="90" y="372" text-anchor="middle" font-size="13" fill="#2B3138">Organ A</text>
</g>
<g>
<rect x="180" y="254" width="120" height="96" rx="14" fill="#F5F7FA" stroke="#8A949E" stroke-width="2"/>
<circle cx="224" cy="290" r="11" fill="#3C9A2E"/><circle cx="256" cy="290" r="11" fill="#D98A00"/><circle cx="240" cy="318" r="11" fill="#C8323F"/>
<path d="M235 290 H245 M229 300 L235 309 M251 300 L245 309" stroke="#2B3138" stroke-width="2"/>
<text x="240" y="372" text-anchor="middle" font-size="13" fill="#2B3138">Organ B</text>
</g>
<g>
<path d="M330 350 V278 L390 254 L450 278 V350 Z" fill="#F5F7FA" stroke="#8A949E" stroke-width="2"/>
<circle cx="374" cy="296" r="11" fill="#3C9A2E"/><circle cx="406" cy="296" r="11" fill="#D98A00"/><circle cx="390" cy="324" r="11" fill="#C8323F"/>
<path d="M385 296 H395 M379 306 L385 315 M401 306 L395 315" stroke="#2B3138" stroke-width="2"/>
<text x="390" y="372" text-anchor="middle" font-size="13" fill="#2B3138">Organ C</text>
</g>
<!-- spatial reference -->
<g stroke="#8A949E" stroke-width="1">
<rect x="492" y="258" width="22" height="22" fill="#3C9A2E"/><rect x="514" y="258" width="22" height="22" fill="#3C9A2E"/><rect x="536" y="258" width="22" height="22" fill="#F5F7FA"/><rect x="558" y="258" width="22" height="22" fill="#F5F7FA"/>
<rect x="492" y="280" width="22" height="22" fill="#F5F7FA"/><rect x="514" y="280" width="22" height="22" fill="#D98A00"/><rect x="536" y="280" width="22" height="22" fill="#C8323F"/><rect x="558" y="280" width="22" height="22" fill="#F5F7FA"/>
<rect x="492" y="302" width="22" height="22" fill="#F5F7FA"/><rect x="514" y="302" width="22" height="22" fill="#C8323F"/><rect x="536" y="302" width="22" height="22" fill="#C8323F"/><rect x="558" y="302" width="22" height="22" fill="#D98A00"/>
</g>
<text x="536" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B3138">Spatial reference</text>
<text x="536" y="364" text-anchor="middle" font-size="13" fill="#8A949E">labels tissue spots</text>
</svg>
