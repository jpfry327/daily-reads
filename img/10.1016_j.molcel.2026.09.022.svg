<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B3138"/></marker></defs>
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#2B3138">Remodel, tail, then cut 18S rRNA</text>
<!-- row 1 -->
<rect x="14" y="50" width="612" height="82" rx="12" fill="#8A949E" fill-opacity="0.08" stroke="#8A949E" stroke-width="2"/>
<ellipse cx="120" cy="91" rx="76" ry="30" fill="#8A949E" fill-opacity="0.25" stroke="#8A949E" stroke-width="2"/>
<path d="M94 96 C104 78 130 78 138 92 C144 104 122 108 118 98" fill="none" stroke="#D98A00" stroke-width="4" stroke-linecap="round"/>
<text x="260" y="86" font-size="16" font-weight="700" fill="#2B3138">Closed 40S</text>
<text x="260" y="108" font-size="14" fill="#2B3138">18S 3' end tucked in</text>
<path d="M120 134 L120 150" stroke="#2B3138" stroke-width="2.5" marker-end="url(#ar)"/>
<!-- row 2 -->
<rect x="14" y="152" width="612" height="82" rx="12" fill="#1E5FA8" fill-opacity="0.06" stroke="#1E5FA8" stroke-width="2"/>
<ellipse cx="130" cy="193" rx="66" ry="30" fill="#8A949E" fill-opacity="0.25" stroke="#8A949E" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="28" y="170" width="68" height="24" rx="12" fill="#1E5FA8"/><text x="62" y="187" text-anchor="middle" font-size="13" fill="#fff">RIOK3</text>
<path d="M186 196 C206 200 226 196 240 184" fill="none" stroke="#D98A00" stroke-width="4" stroke-linecap="round"/>
<text x="274" y="188" font-size="16" font-weight="700" fill="#1E5FA8">RIOK3 remodels 40S</text>
<text x="274" y="210" font-size="14" fill="#2B3138">3' end now exposed</text>
<path d="M120 236 L120 252" stroke="#2B3138" stroke-width="2.5" marker-end="url(#ar)"/>
<!-- row 3 -->
<rect x="14" y="254" width="612" height="82" rx="12" fill="#C8323F" fill-opacity="0.06" stroke="#C8323F" stroke-width="2"/>
<ellipse cx="90" cy="295" rx="56" ry="26" fill="#8A949E" fill-opacity="0.25" stroke="#8A949E" stroke-width="2"/>
<path d="M142 298 C154 302 164 300 170 294" fill="none" stroke="#D98A00" stroke-width="4" stroke-linecap="round"/>
<text x="196" y="302" font-size="15" font-weight="700" fill="#C8323F">UUUU</text>
<path d="M246 288 L256 302 L248 306 L260 320" fill="none" stroke="#C8323F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="154" y="262" width="82" height="22" rx="11" fill="#C8323F"/><text x="195" y="278" text-anchor="middle" font-size="13" fill="#fff">DIS3L2</text>
<text x="292" y="290" font-size="16" font-weight="700" fill="#C8323F">Uridylated, then degraded</text>
<text x="292" y="314" font-size="14" fill="#2B3138">Exo cut triggers endo cut</text>
<!-- nanopore strip -->
<rect x="14" y="350" width="612" height="40" rx="12" fill="#3C9A2E" fill-opacity="0.08" stroke="#3C9A2E" stroke-width="2"/>
<rect x="44" y="358" width="14" height="24" fill="#3C9A2E"/><rect x="68" y="358" width="14" height="24" fill="#3C9A2E"/>
<path d="M30 370 C40 362 50 378 63 370 C76 362 86 378 96 370" fill="none" stroke="#D98A00" stroke-width="2.5"/>
<text x="120" y="376" font-size="14" font-weight="700" fill="#2B3138">Read by nanopore sequencing</text>
</svg>
