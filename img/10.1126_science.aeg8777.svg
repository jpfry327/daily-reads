<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#FFFFFF"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2B3138">Canine Cancer Genome Atlas: dog versus human</text>
<!-- left column: cohort -->
<rect x="24" y="56" width="212" height="74" rx="8" fill="#F5F7FA" stroke="#8A949E" stroke-width="2"/>
<text x="130" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B3138">667 tumour-normal pairs</text>
<text x="130" y="102" text-anchor="middle" font-size="13" fill="#2B3138">10 canine tumour types</text>
<text x="130" y="120" text-anchor="middle" font-size="13" fill="#8A949E">whole-exome data</text>
<path d="M130 130 V152" stroke="#2B3138" stroke-width="2.5"/>
<polygon points="130,162 123,150 137,150" fill="#2B3138"/>
<rect x="24" y="164" width="212" height="34" rx="17" fill="#1E5FA8"/>
<text x="130" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Consensus variant calling</text>
<path d="M130 198 V214" stroke="#2B3138" stroke-width="2.5"/>
<polygon points="130,224 123,212 137,212" fill="#2B3138"/>
<!-- four variant classes -->
<g>
<path d="M30 246 H112" stroke="#8A949E" stroke-width="6" stroke-linecap="round"/>
<rect x="66" y="238" width="10" height="16" fill="#C8323F"/>
<text x="124" y="251" font-size="13" fill="#2B3138">Point mutations</text>
<path d="M30 278 H60 M82 278 H112" stroke="#8A949E" stroke-width="6" stroke-linecap="round"/>
<path d="M60 278 L71 266 L82 278" fill="none" stroke="#D98A00" stroke-width="2.5"/>
<text x="124" y="283" font-size="13" fill="#2B3138">Indels</text>
<path d="M30 310 H58" stroke="#8A949E" stroke-width="6" stroke-linecap="round"/>
<path d="M84 310 H112" stroke="#3C9A2E" stroke-width="6" stroke-linecap="round"/>
<path d="M58 310 C66 294 76 326 84 310" fill="none" stroke="#2B3138" stroke-width="2" stroke-dasharray="3 3"/>
<text x="124" y="315" font-size="13" fill="#2B3138">Structural variants</text>
<path d="M30 346 H112" stroke="#8A949E" stroke-width="6" stroke-linecap="round"/>
<path d="M56 338 H86 M56 330 H86" stroke="#1E5FA8" stroke-width="6" stroke-linecap="round"/>
<text x="124" y="343" font-size="13" fill="#2B3138">Copy number changes</text>
</g>
<text x="130" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#C8323F">39 driver genes under selection</text>
<!-- connector to Venn -->
<path d="M246 214 H272" stroke="#2B3138" stroke-width="2.5"/>
<polygon points="282,214 270,207 270,221" fill="#2B3138"/>
<!-- Venn -->
<circle cx="392" cy="214" r="104" fill="#D98A00" fill-opacity="0.22" stroke="#D98A00" stroke-width="2.5"/>
<circle cx="512" cy="214" r="104" fill="#1E5FA8" fill-opacity="0.22" stroke="#1E5FA8" stroke-width="2.5"/>
<text x="350" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#D98A00">Dog tumours</text>
<text x="556" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E5FA8">Human tumours</text>
<text x="346" y="210" text-anchor="middle" font-size="13" fill="#2B3138">Dog-enriched</text>
<text x="346" y="228" text-anchor="middle" font-size="13" fill="#2B3138">pathways</text>
<text x="452" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B3138">Conserved</text>
<text x="452" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B3138">oncogenic</text>
<text x="452" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B3138">mechanisms</text>
<text x="560" y="210" text-anchor="middle" font-size="13" fill="#2B3138">Human-enriched</text>
<text x="560" y="228" text-anchor="middle" font-size="13" fill="#2B3138">pathways</text>
<text x="452" y="352" text-anchor="middle" font-size="13" fill="#8A949E">Matched tumour types compared</text>
</svg>
