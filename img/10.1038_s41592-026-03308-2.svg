<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#FFFFFF"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2B3138">GeneSPOT: how far apart are two genes in space?</text>
<!-- young tissue -->
<text x="160" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B3138">Young tissue</text>
<path d="M50 190 C50 110 120 84 190 92 C260 100 284 150 270 210 C258 264 190 290 120 276 C70 266 50 236 50 190 Z" fill="#F5F7FA" stroke="#8A949E" stroke-width="2.5"/>
<g fill="#1E5FA8"><circle cx="110" cy="150" r="7"/><circle cx="132" cy="134" r="7"/><circle cx="140" cy="164" r="7"/><circle cx="116" cy="178" r="7"/><circle cx="160" cy="146" r="7"/></g>
<g fill="#D98A00"><circle cx="124" cy="156" r="7"/><circle cx="148" cy="128" r="7"/><circle cx="154" cy="172" r="7"/><circle cx="100" cy="166" r="7"/><circle cx="134" cy="186" r="7"/></g>
<path d="M92 204 C110 220 150 220 170 200" fill="none" stroke="#3C9A2E" stroke-width="3"/>
<text x="166" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C9A2E">short transport distance</text>
<!-- aged tissue -->
<text x="480" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B3138">Aged tissue</text>
<path d="M370 190 C370 110 440 84 510 92 C580 100 604 150 590 210 C578 264 510 290 440 276 C390 266 370 236 370 190 Z" fill="#F5F7FA" stroke="#8A949E" stroke-width="2.5"/>
<g fill="#1E5FA8"><circle cx="420" cy="150" r="7"/><circle cx="442" cy="134" r="7"/><circle cx="450" cy="164" r="7"/><circle cx="426" cy="178" r="7"/><circle cx="408" cy="162" r="7"/></g>
<g fill="#D98A00"><circle cx="530" cy="200" r="7"/><circle cx="552" cy="184" r="7"/><circle cx="558" cy="214" r="7"/><circle cx="534" cy="228" r="7"/><circle cx="514" cy="216" r="7"/></g>
<path d="M452 184 C470 214 490 222 506 220" fill="none" stroke="#C8323F" stroke-width="3" stroke-dasharray="7 5"/>
<polygon points="512,220 500,213 501,227" fill="#C8323F"/>
<text x="470" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#C8323F">long transport distance</text>
<!-- middle arrow -->
<path d="M290 186 L346 186" stroke="#2B3138" stroke-width="3"/>
<polygon points="358,186 344,178 344,194" fill="#2B3138"/>
<text x="322" y="170" text-anchor="middle" font-size="13" fill="#2B3138">ageing</text>
<!-- legend -->
<circle cx="150" cy="322" r="7" fill="#1E5FA8"/>
<text x="164" y="327" font-size="14" fill="#2B3138">gene A spots</text>
<circle cx="290" cy="322" r="7" fill="#D98A00"/>
<text x="304" y="327" font-size="14" fill="#2B3138">gene B spots</text>
<text x="410" y="327" font-size="14" fill="#8A949E">(same spot count)</text>
<rect x="70" y="346" width="500" height="36" rx="18" fill="#FFFFFF" stroke="#1E5FA8" stroke-width="2"/>
<text x="320" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E5FA8">Expression unchanged, spatial relationship rewired</text>
</svg>
