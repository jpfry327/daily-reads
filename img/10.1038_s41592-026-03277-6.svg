<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#FFFFFF"/>
<text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2B3138">tRIBO-seq: tRNAs on translating ribosomes</text>
<!-- mRNA -->
<path d="M30 150 H250" stroke="#8A949E" stroke-width="4" fill="none"/>
<text x="30" y="176" font-size="13" fill="#8A949E">mRNA</text>
<!-- ribosome -->
<ellipse cx="140" cy="118" rx="62" ry="24" fill="#1E5FA8" opacity="0.85"/>
<ellipse cx="140" cy="86" rx="40" ry="20" fill="#1E5FA8" opacity="0.55"/>
<text x="140" y="124" text-anchor="middle" font-size="13" fill="#FFFFFF">Ribosome</text>
<!-- tRNAs -->
<path d="M118 142 v-10 M162 142 v-10" stroke="#C8323F" stroke-width="5"/>
<circle cx="118" cy="150" r="6" fill="#C8323F"/><circle cx="162" cy="150" r="6" fill="#C8323F"/>
<text x="140" y="206" text-anchor="middle" font-size="13" fill="#C8323F">Ribo-tRNAs</text>
<!-- arrow to nanopore -->
<path d="M140 218 V262" stroke="#2B3138" stroke-width="2.5" fill="none"/>
<path d="M132 254 L140 266 L148 254" fill="#2B3138"/>
<!-- nanopore -->
<rect x="70" y="272" width="140" height="22" rx="4" fill="#8A949E"/>
<rect x="128" y="272" width="24" height="22" fill="#FFFFFF"/>
<path d="M140 250 V300" stroke="#C8323F" stroke-width="3" stroke-dasharray="5 4"/>
<text x="140" y="326" text-anchor="middle" font-size="13" fill="#2B3138">Nanopore read-out</text>
<text x="140" y="346" text-anchor="middle" font-size="13" fill="#2B3138">one experiment</text>
<!-- divider -->
<path d="M262 70 V370" stroke="#8A949E" stroke-width="1" stroke-dasharray="4 4"/>
<!-- right panel: stress -->
<text x="450" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B3138">Stress changes the tRNAome</text>
<rect x="282" y="90" width="340" height="82" rx="8" fill="#FFFFFF" stroke="#1E5FA8" stroke-width="2"/>
<text x="296" y="116" font-size="14" font-weight="bold" fill="#1E5FA8">Viral infection</text>
<text x="296" y="136" font-size="14" font-weight="bold" fill="#1E5FA8">Leucine deprivation</text>
<text x="296" y="160" font-size="13" fill="#2B3138">Ribo-tRNA abundance shifts</text>
<rect x="282" y="186" width="340" height="82" rx="8" fill="#FFFFFF" stroke="#D98A00" stroke-width="2"/>
<text x="296" y="212" font-size="14" font-weight="bold" fill="#D98A00">Methionine starvation</text>
<text x="296" y="236" font-size="13" fill="#2B3138">Methyl tRNA modifications lost</text>
<text x="296" y="256" font-size="13" fill="#2B3138">on ribosome-bound tRNAs</text>
<rect x="282" y="282" width="340" height="82" rx="8" fill="#FFFFFF" stroke="#C8323F" stroke-width="2"/>
<text x="296" y="308" font-size="14" font-weight="bold" fill="#C8323F">Arsenite exposure</text>
<text x="296" y="332" font-size="13" fill="#2B3138">Abundance, modifications unchanged</text>
<text x="296" y="352" font-size="13" fill="#2B3138">Selected ribo-tRNAs fragmented</text>
</svg>
