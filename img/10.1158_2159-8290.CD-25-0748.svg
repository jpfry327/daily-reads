<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="30" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">NETs around necrosis in colon cancer</text>
  <text x="320" y="52" font-size="13" fill="#8A949E" text-anchor="middle">blocking NETs reduces necrosis and metastasis</text>
  <!-- left: untreated tumour -->
  <text x="160" y="86" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">Untreated tumour</text>
  <ellipse cx="160" cy="190" rx="115" ry="85" fill="#F3F5F7" stroke="#8A949E" stroke-width="2"/>
  <ellipse cx="160" cy="190" rx="52" ry="38" fill="#8A949E"/>
  <text x="160" y="195" font-size="13" fill="#FFFFFF" text-anchor="middle">necrosis</text>
  <g stroke="#C8323F" stroke-width="2" fill="none">
    <path d="M100 160 q10 -14 22 -8 q12 6 18 -10"/><path d="M200 150 q12 -10 22 0 q10 10 18 4"/>
    <path d="M214 218 q12 6 20 -4 q8 -10 14 0"/><path d="M92 220 q10 10 22 6 q10 -4 16 8"/>
  </g>
  <circle cx="108" cy="150" r="7" fill="#D98A00"/><circle cx="230" cy="146" r="7" fill="#D98A00"/>
  <circle cx="240" cy="222" r="7" fill="#D98A00"/><circle cx="100" cy="230" r="7" fill="#D98A00"/>
  <text x="160" y="310" font-size="13" fill="#C8323F" text-anchor="middle">NET aggregates</text>
  <text x="160" y="328" font-size="13" fill="#D98A00" text-anchor="middle">NET-primed neutrophils</text>
  <!-- middle arrow -->
  <rect x="290" y="165" width="60" height="50" rx="8" fill="#FFFFFF" stroke="#1E5FA8" stroke-width="2"/>
  <text x="320" y="186" font-size="13" font-weight="bold" fill="#1E5FA8" text-anchor="middle">NET</text>
  <text x="320" y="204" font-size="13" font-weight="bold" fill="#1E5FA8" text-anchor="middle">block</text>
  <path d="M358 190 L398 190" stroke="#2B3138" stroke-width="2.5"/><path d="M398 190 L388 183 M398 190 L388 197" stroke="#2B3138" stroke-width="2.5"/>
  <!-- right: NET inhibited -->
  <text x="500" y="86" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">NET inhibition</text>
  <ellipse cx="500" cy="190" rx="105" ry="80" fill="#F3F5F7" stroke="#3C9A2E" stroke-width="2"/>
  <ellipse cx="500" cy="190" rx="16" ry="12" fill="#8A949E"/>
  <circle cx="450" cy="170" r="7" fill="#D98A00"/><circle cx="548" cy="165" r="7" fill="#D98A00"/>
  <circle cx="470" cy="226" r="7" fill="#D98A00"/><circle cx="540" cy="224" r="7" fill="#D98A00"/>
  <text x="500" y="310" font-size="13" fill="#3C9A2E" text-anchor="middle">less necrosis, less metastasis</text>
  <text x="500" y="328" font-size="13" fill="#2B3138" text-anchor="middle">chemotherapy works better</text>
  <text x="320" y="372" font-size="13" fill="#8A949E" text-anchor="middle">mismatch-repair-proficient mouse model</text>
</svg>
