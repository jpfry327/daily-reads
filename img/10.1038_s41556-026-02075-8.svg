<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#2B3138">Building the human meninges</text>
<!-- skull marrow -->
<rect x="150" y="56" width="340" height="40" rx="8" fill="#D98A00" fill-opacity="0.22" stroke="#D98A00" stroke-width="2"/>
<text x="320" y="82" text-anchor="middle" font-size="14" fill="#2B3138">cranial marrow</text>
<g fill="#1E5FA8"><circle cx="196" cy="76" r="7"/><circle cx="242" cy="70" r="7"/><circle cx="410" cy="78" r="7"/><circle cx="452" cy="72" r="7"/></g>
<text x="528" y="78" text-anchor="middle" font-size="13" fill="#1E5FA8">B cells</text>
<!-- migration arrows -->
<g stroke="#1E5FA8" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M242 98 L242 132"/><path d="M410 98 L410 132"/></g>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#1E5FA8"/></marker></defs>
<text x="326" y="122" text-anchor="middle" font-size="13" fill="#1E5FA8">cell2home: chemotaxis</text>
<!-- meningeal layers -->
<rect x="150" y="136" width="340" height="34" fill="#8A949E" fill-opacity="0.35"/><text x="170" y="158" font-size="14" fill="#2B3138">dura</text>
<rect x="150" y="170" width="340" height="34" fill="#3C9A2E" fill-opacity="0.25"/><text x="170" y="192" font-size="14" fill="#2B3138">arachnoid</text>
<rect x="150" y="204" width="340" height="34" fill="#D98A00" fill-opacity="0.25"/><text x="170" y="226" font-size="14" fill="#2B3138">pia</text>
<g fill="#C8323F"><circle cx="300" cy="153" r="7"/><circle cx="360" cy="188" r="7"/><circle cx="420" cy="221" r="7"/></g>
<text x="432" y="158" font-size="13" fill="#C8323F">macrophages (myeloid)</text>
<!-- brain / BBB -->
<rect x="150" y="246" width="340" height="30" rx="6" fill="#1E5FA8" fill-opacity="0.12" stroke="#1E5FA8" stroke-width="2"/>
<text x="320" y="266" text-anchor="middle" font-size="14" fill="#2B3138">brain: barrier endothelium</text>
<!-- yolk sac -->
<ellipse cx="68" cy="190" rx="52" ry="40" fill="#D98A00" fill-opacity="0.3" stroke="#D98A00" stroke-width="2"/>
<text x="68" y="195" text-anchor="middle" font-size="14" fill="#2B3138">yolk sac</text>
<path d="M120 190 L146 190" stroke="#C8323F" stroke-width="3" marker-end="url(#b)"/>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#C8323F"/></marker></defs>
<text x="68" y="248" text-anchor="middle" font-size="13" fill="#C8323F">myeloid origin</text>
<!-- trisomy 21 -->
<rect x="40" y="300" width="560" height="84" rx="8" fill="#fff" stroke="#8A949E" stroke-width="2"/>
<text x="60" y="326" font-size="15" font-weight="700" fill="#2B3138">Trisomy 21 fibroblasts</text>
<text x="60" y="352" font-size="14" fill="#2B3138">chemokines</text><text x="150" y="352" font-size="18" fill="#C8323F">▼</text>
<text x="250" y="352" font-size="14" fill="#2B3138">JAK-STAT</text><text x="330" y="352" font-size="18" fill="#3C9A2E">▲</text>
<text x="60" y="374" font-size="13" fill="#8A949E">snRNA + snATAC + spatial atlas, 6–21 weeks</text>
<text x="440" y="352" font-size="13" fill="#2B3138">Nichefinder maps</text><text x="440" y="372" font-size="13" fill="#2B3138">cell neighbourhoods</text>
</svg>
