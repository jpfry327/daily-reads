<text x="167" y="342" text-anchor="middle" font-size="13" fill="#2B3138">favourable prognosis</text>
<!-- panel B -->
<rect x="325" y="50" width="295" height="330" rx="8" fill="#FFFFFF" stroke="#8A949E" stroke-width="2"/>
