<text x="552" y="204" text-anchor="middle" font-size="13" fill="#3C9A2E">immune</text>
<path d="M428 170 L470 168" stroke="#2B3138" stroke-width="2.5"/><polygon points="464,161 476,168 464,176" fill="#2B3138"/>
