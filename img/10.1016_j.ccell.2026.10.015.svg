<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="30" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">SCLC subtype and tarlatamab</text>
  <text x="320" y="52" font-size="13" fill="#8A949E" text-anchor="middle">DLL3 x CD3 T cell engager response by TF subtype</text>
  <!-- engager -->
  <circle cx="70" cy="150" r="30" fill="#F3F5F7" stroke="#1E5FA8" stroke-width="2.5"/>
  <text x="70" y="155" font-size="14" font-weight="bold" fill="#1E5FA8" text-anchor="middle">T cell</text>
  <rect x="104" y="140" width="60" height="20" rx="10" fill="#FFFFFF" stroke="#2B3138" stroke-width="2"/>
  <text x="134" y="154" font-size="13" fill="#2B3138" text-anchor="middle">CD3</text>
  <text x="134" y="124" font-size="13" font-weight="bold" fill="#2B3138" text-anchor="middle">tarlatamab</text>
  <path d="M164 150 L206 150" stroke="#2B3138" stroke-width="2.5"/>
  <text x="134" y="182" font-size="13" fill="#2B3138" text-anchor="middle">DLL3 binder</text>
  <!-- three tumour cells -->
  <g>
    <circle cx="250" cy="150" r="42" fill="#E3F0DF" stroke="#3C9A2E" stroke-width="2.5"/>
    <text x="250" y="148" font-size="14" font-weight="bold" fill="#3C9A2E" text-anchor="middle">ASCL1</text>
    <text x="250" y="166" font-size="13" fill="#2B3138" text-anchor="middle">drives DLL3</text>
    <circle cx="390" cy="150" r="42" fill="#FBEFD3" stroke="#D98A00" stroke-width="2.5"/>
    <text x="390" y="155" font-size="14" font-weight="bold" fill="#D98A00" text-anchor="middle">NEUROD1</text>
    <circle cx="530" cy="150" r="42" fill="#F6DADD" stroke="#C8323F" stroke-width="2.5"/>
    <text x="530" y="155" font-size="14" font-weight="bold" fill="#C8323F" text-anchor="middle">POU2F3</text>
  </g>
  <text x="250" y="216" font-size="13" font-weight="bold" fill="#3C9A2E" text-anchor="middle">response enriched</text>
  <text x="390" y="216" font-size="13" font-weight="bold" fill="#D98A00" text-anchor="middle">inferior response</text>
  <text x="530" y="216" font-size="13" font-weight="bold" fill="#C8323F" text-anchor="middle">intrinsically resistant</text>
  <!-- evolution -->
  <path d="M250 236 C 280 272 340 272 384 240" stroke="#2B3138" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
  <path d="M384 240 L374 240 M384 240 L382 251" stroke="#2B3138" stroke-width="2.5" fill="none"/>
  <text x="316" y="290" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">Acquired resistance</text>
  <text x="316" y="312" font-size="13" fill="#2B3138" text-anchor="middle">selects a NEUROD1-high state</text>
  <rect x="60" y="334" width="520" height="40" rx="10" fill="#F3F5F7" stroke="#8A949E" stroke-width="1.5"/>
  <text x="320" y="359" font-size="13" fill="#2B3138" text-anchor="middle">Plasma chromatin infers tumour expression; syngeneic mouse model</text>
</svg>
