<rect x="24" y="48" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#1E5FA8" stroke-width="2"/>
<text x="124" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E5FA8">Single-nucleus multiome</text>
<text x="124" y="88" text-anchor="middle" font-size="13" fill="#2B3138">&gt;1 million GBM cells</text>
<path d="M230 73 H258" stroke="#2B3138" stroke-width="2.5"/><path d="M250 65 L262 73 L250 81" fill="#2B3138"/>
<rect x="268" y="56" width="110" height="34" rx="6" fill="#3C9A2E"/>
