<rect x="431" y="150" width="84" height="28" rx="6"/>
<rect x="358" y="204" width="84" height="28" rx="6"/><rect x="504" y="204" width="84" height="28" rx="6"/>
<rect x="358" y="258" width="84" height="28" rx="6"/><rect x="504" y="258" width="84" height="28" rx="6"/>
</g>
<g font-size="13" text-anchor="middle" fill="#1E5FA8">
<text x="473" y="169">State A</text><text x="400" y="223">State B</text><text x="546" y="223">State C</text>
<text x="400" y="277">State D</text><text x="546" y="277">State E</text>
