<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="30" font-size="19" font-weight="bold" fill="#2B3138" text-anchor="middle">Paused genes buffer low RNAPII</text>
  <text x="320" y="52" font-size="13" fill="#8A949E" text-anchor="middle">RNAPII depleted in HEK293 (dTAG)</text>

  <!-- Row A: strongly paused gene -->
  <text x="30" y="86" font-size="15" font-weight="bold" fill="#1E5FA8">Strongly paused gene</text>
  <line x1="60" y1="130" x2="566" y2="130" stroke="#8A949E" stroke-width="3"/>
  <path d="M84 130 V108 H98" fill="none" stroke="#2B3138" stroke-width="2"/>
  <polygon points="98,103 107,108 98,113" fill="#2B3138"/>
  <circle cx="122" cy="119" r="11" fill="#1E5FA8"/><circle cx="145" cy="119" r="11" fill="#1E5FA8"/><circle cx="168" cy="119" r="11" fill="#1E5FA8"/>
  <rect x="230" y="122" width="60" height="16" fill="#1E5FA8"/>
  <rect x="350" y="122" width="60" height="16" fill="#1E5FA8"/>
  <rect x="470" y="122" width="60" height="16" fill="#1E5FA8"/>
  <path d="M290 122 Q320 98 350 122" fill="none" stroke="#2B3138" stroke-width="1.5"/>
  <path d="M410 122 Q440 98 470 122" fill="none" stroke="#2B3138" stroke-width="1.5"/>
  <line x1="566" y1="116" x2="566" y2="144" stroke="#2B3138" stroke-width="2"/>
  <text x="566" y="108" font-size="13" fill="#2B3138" text-anchor="middle">pA site</text>
  <text x="145" y="166" font-size="13" fill="#1E5FA8" text-anchor="middle">Paused RNAPII reserve</text>
  <text x="380" y="166" font-size="14" font-weight="bold" fill="#3C9A2E" text-anchor="middle">Largely resistant</text>

  <line x1="30" y1="192" x2="610" y2="192" stroke="#8A949E" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- Row B: weakly paused gene -->
  <text x="30" y="222" font-size="15" font-weight="bold" fill="#C8323F">Weakly paused gene</text>
  <line x1="60" y1="270" x2="566" y2="270" stroke="#8A949E" stroke-width="3"/>
  <line x1="566" y1="270" x2="614" y2="270" stroke="#C8323F" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="614,264 625,270 614,276" fill="#C8323F"/>
  <path d="M84 270 V248 H98" fill="none" stroke="#2B3138" stroke-width="2"/>
  <polygon points="98,243 107,248 98,253" fill="#2B3138"/>
  <circle cx="122" cy="259" r="11" fill="#1E5FA8"/>
  <circle cx="145" cy="259" r="10" fill="none" stroke="#8A949E" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="168" cy="259" r="10" fill="none" stroke="#8A949E" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="230" y="262" width="60" height="16" fill="#1E5FA8"/>
  <rect x="350" y="262" width="60" height="16" fill="#FFFFFF" stroke="#8A949E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="470" y="262" width="60" height="16" fill="#1E5FA8"/>
  <path d="M290 262 Q380 222 470 262" fill="none" stroke="#C8323F" stroke-width="2"/>
  <text x="380" y="232" font-size="14" font-weight="bold" fill="#C8323F" text-anchor="middle">Splicing altered</text>
  <line x1="566" y1="256" x2="566" y2="284" stroke="#2B3138" stroke-width="2"/>
  <circle cx="592" cy="259" r="11" fill="#1E5FA8"/>
  <text x="145" y="306" font-size="13" fill="#8A949E" text-anchor="middle">Little reserve</text>
  <text x="625" y="306" font-size="14" font-weight="bold" fill="#C8323F" text-anchor="end">Readthrough past pA</text>

  <!-- half-life compensation -->
  <rect x="130" y="330" width="380" height="52" rx="10" fill="#FBF1DC" stroke="#D98A00" stroke-width="1.5"/>
  <text x="320" y="352" font-size="14" font-weight="bold" fill="#2B3138" text-anchor="middle">Severe depletion</text>
  <text x="320" y="371" font-size="13" fill="#2B3138" text-anchor="middle">longer transcript half-lives stabilise mRNA</text>

  <!-- key -->
  <circle cx="486" cy="80" r="8" fill="#1E5FA8"/>
  <text x="500" y="85" font-size="13" fill="#2B3138">RNAPII</text>
</svg>
