<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Noto Sans, Arial, sans-serif">
<rect width="640" height="400" fill="#FFFFFF"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2B3138">structRFM: masking whole base pairs</text>
<!-- base-pair arcs -->
<path d="M122 130 Q320 40 518 130" fill="none" stroke="#1E5FA8" stroke-width="2.5"/>
<path d="M158 130 Q320 64 482 130" fill="none" stroke="#1E5FA8" stroke-width="2.5"/>
<path d="M194 130 Q320 88 446 130" fill="none" stroke="#D98A00" stroke-width="2.5" stroke-dasharray="6 4"/>
<!-- sequence boxes -->
<g stroke="#8A949E" stroke-width="1.5" fill="#FFFFFF">
<rect x="104" y="130" width="36" height="32"/><rect x="140" y="130" width="36" height="32"/>
<rect x="176" y="130" width="36" height="32" fill="#FBEBCC" stroke="#D98A00"/>
<rect x="212" y="130" width="36" height="32"/><rect x="248" y="130" width="36" height="32"/><rect x="284" y="130" width="36" height="32"/>
<rect x="320" y="130" width="36" height="32"/><rect x="356" y="130" width="36" height="32"/><rect x="392" y="130" width="36" height="32"/>
<rect x="428" y="130" width="36" height="32" fill="#FBEBCC" stroke="#D98A00"/>
<rect x="464" y="130" width="36" height="32"/><rect x="500" y="130" width="36" height="32"/>
</g>
<g font-size="16" font-weight="bold" text-anchor="middle" fill="#2B3138">
<text x="122" y="152">G</text><text x="158" y="152">G</text><text x="194" y="152" fill="#D98A00">?</text>
<text x="230" y="152">C</text><text x="266" y="152">A</text><text x="302" y="152">G</text><text x="338" y="152">A</text><text x="374" y="152">C</text><text x="410" y="152">A</text>
<text x="446" y="152" fill="#D98A00">?</text><text x="482" y="152">C</text><text x="518" y="152">C</text>
</g>
<text x="320" y="190" text-anchor="middle" font-size="13" fill="#2B3138">Both bases of a masked pair are hidden together</text>
<!-- MUSES ensemble -->
<g stroke="#1E5FA8" stroke-width="2" fill="#FFFFFF">
<rect x="40" y="214" width="104" height="34" rx="6"/><rect x="156" y="214" width="104" height="34" rx="6"/><rect x="272" y="214" width="104" height="34" rx="6"/>
</g>
<g font-size="13" text-anchor="middle" fill="#1E5FA8">
<text x="92" y="236">Predictor 1</text><text x="208" y="236">Predictor 2</text><text x="324" y="236">Predictor 3</text>
</g>
<path d="M382 231 H420" stroke="#2B3138" stroke-width="2.5"/><path d="M412 223 L424 231 L412 239" fill="#2B3138"/>
<rect x="430" y="214" width="170" height="34" rx="6" fill="#3C9A2E"/>
<text x="515" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">MUSES consensus</text>
<text x="320" y="272" text-anchor="middle" font-size="13" fill="#8A949E">Ensemble limits any single predictor's bias</text>
<!-- model -->
<path d="M320 280 V296" stroke="#2B3138" stroke-width="2.5"/><path d="M312 290 L320 302 L328 290" fill="#2B3138"/>
<rect x="150" y="304" width="340" height="34" rx="6" fill="#1E5FA8"/>
<text x="320" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">structRFM: 21 million sequence-structure pairs</text>
<!-- tasks -->
<g stroke="#8A949E" stroke-width="2" fill="#FFFFFF">
<rect x="24" y="356" width="190" height="32" rx="16"/><rect x="225" y="356" width="190" height="32" rx="16"/><rect x="426" y="356" width="190" height="32" rx="16"/>
</g>
<g font-size="13" text-anchor="middle" fill="#2B3138">
<text x="119" y="377">Zero-shot homology</text><text x="320" y="377">Secondary structure</text><text x="521" y="377">Tertiary adaptation</text>
